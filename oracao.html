const DEF_STATE = {
  xp:0, streak:0, lastStudy:null, totalEx:0, totalCorrect:0,
  prayerData:{}, history:[], dailyGoal:10, todayDone:0, todayDate:''
};

let ST = (() => {
  try { return Object.assign({}, DEF_STATE, JSON.parse(localStorage.getItem('oratio_v2')||'{}')); }
  catch(e){ return {...DEF_STATE}; }
})();

function saveState(){ localStorage.setItem('oratio_v2', JSON.stringify(ST)); }

function getPD(id){
  if(!ST.prayerData[id]) ST.prayerData[id] = {rep:0,ef:2.5,interval:1,nextReview:Date.now(),correct:0,total:0};
  return ST.prayerData[id];
}

function checkStreak(){
  const today = new Date().toDateString();
  const yesterday = new Date(Date.now()-86400000).toDateString();
  if(ST.todayDate !== today){
    if(ST.lastStudy === yesterday){ ST.streak += 1; }
    else if(ST.lastStudy !== today){ ST.streak = 1; }
    ST.todayDate = today; ST.todayDone = 0;
  }
  ST.lastStudy = today;
}

function addXP(amt, x, y){
  ST.xp += amt;
  const el = document.createElement('div');
  el.className='xpp'; el.textContent='+'+amt+'xp';
  el.style.cssText=`left:${x||200}px;top:${y||200}px;`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1600);
  document.getElementById('hXP').textContent = ST.xp;
}

function getLevel(){ return Math.floor(Math.sqrt(ST.xp/100))+1; }

// SM-2 Spaced Repetition
function sm2(pd, q){
  let {rep,ef,interval} = pd;
  if(q<3){ rep=0; interval=1; }
  else {
    if(rep===0) interval=1;
    else if(rep===1) interval=6;
    else interval=Math.round(interval*ef);
    rep++;
  }
  ef=Math.max(1.3, ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));
  pd.rep=rep; pd.ef=ef; pd.interval=interval;
  pd.nextReview = Date.now()+(interval*86400000);
  pd.total++; if(q>=3) pd.correct++;
}

function getDue(){
  const now = Date.now();
  return PRAYERS.filter(p=>getPD(p.id).nextReview<=now).slice(0,5);
}
function getNew(){
  return PRAYERS.filter(p=>getPD(p.id).total===0).slice(0,5);
}
function getQueue(){ return [...getDue(),...getNew()].slice(0,10); }

function startSession(){
  EX = { queue: getQueue(), idx:0, correct:0, type:'auto' };
  if(!EX.queue.length) EX.queue = PRAYERS.slice(0,10);
  nav('Ex');
  nextExercise();
}

function startCatSession(cat){
  const prayers = PRAYERS.filter(p=>p.cat===cat);
  EX = { queue:prayers.slice(0,8), idx:0, correct:0, type:'auto' };
  nav('Ex');
  nextExercise();
}

function startExType(type){
  EX = { queue: [...PRAYERS].sort(()=>Math.random()-.5).slice(0,8), idx:0, correct:0, type };
  nextExercise();
}

function nextExercise(){
  if(!EX || EX.idx >= EX.queue.length){ showCompletion(); return; }
  const prayer = EX.queue[EX.idx];
  const types = ['lacunas','ordem','multipla','digitacao','flashcard','progressivo','cronometro','iniciais','identificar','eco'];
  const type = EX.type === 'auto' ? types[Math.floor(Math.random()*types.length)] : EX.type;
  EX.currentType = type;
  renderExercise(prayer, type);
}

function showCompletion(){
  const xpEarned = EX.correct * 20;
  addXP(xpEarned, 300, 200);
  checkStreak(); saveState();
  document.getElementById('pgEx').innerHTML = `
<div class="complete">
  <div class="cmp-ico">${EX.correct >= EX.queue.length*0.8 ? '🏆' : EX.correct >= EX.queue.length*0.5 ? '⭐' : '💪'}</div>
  <div class="cmp-t">${EX.correct >= EX.queue.length*0.8 ? 'Excelente!' : EX.correct >= EX.queue.length*0.5 ? 'Bom Trabalho!' : 'Continue Praticando!'}</div>
  <div class="cmp-s">${EX.correct} de ${EX.queue.length} corretas • +${xpEarned} XP ganhos</div>
  <div style="display:flex;gap:10px;margin-top:20px">
    <button class="btn btn-p" onclick="startSession()" style="flex:1">Nova Sessão</button>
    <button class="btn btn-s" onclick="nav('Home')" style="flex:1">Início</button>
  </div>
</div>`;
}

function clearActiveTimers(){
  if(window._cronInterval){ clearInterval(window._cronInterval); window._cronInterval=null; }
  if(window._ecoInterval){ clearInterval(window._ecoInterval); window._ecoInterval=null; }
  if(window._pubIv){ clearInterval(window._pubIv); window._pubIv=null; }
}

function retryExercise(){
  clearActiveTimers();
  renderExercise(EX.queue[EX.idx], EX.currentType);
}

function continueExercise(){
  clearActiveTimers();
  EX.idx++;
  nextExercise();
}

function showRetryButtons(){
  document.querySelectorAll('#pgEx button').forEach(b=>{ b.disabled=true; b.style.opacity='0.45'; b.style.pointerEvents='none'; });
  const div=document.createElement('div');
  div.style.cssText='display:flex;gap:8px;margin-top:14px';
  div.innerHTML=`<button class="btn btn-p" style="flex:1;opacity:1;pointer-events:auto" onclick="retryExercise()">🔁 Tentar de Novo</button><button class="btn btn-s" style="flex:1;opacity:1;pointer-events:auto" onclick="continueExercise()">→ Continuar</button>`;
  document.getElementById('pgEx').appendChild(div);
}

function renderExercise(prayer, type){
  const pg = document.getElementById('pgEx');
  const prog = `${EX.idx+1}/${EX.queue.length}`;
  const pct = Math.round((EX.idx/EX.queue.length)*100);
  const hdr = `
<div style="margin-bottom:14px">
  <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--tm);margin-bottom:4px">
    <span>${prog}</span><span>${EX.correct} corretas</span>
  </div>
  <div class="pb"><div class="pf" style="width:${pct}%"></div></div>
</div>`;

  const renderers = { lacunas, ordem, multipla, digitacao, flashcard, progressivo, cronometro, publico, iniciais, identificar, parear, eco };
  if(renderers[type]) renderers[type](pg, hdr, prayer);
  else lacunas(pg, hdr, prayer);
}

// ─── LACUNAS ───────────────────────────────────────
function lacunas(pg, hdr, prayer){
  const words = prayer.text.split(' ');
  const total = words.length;
  const n = Math.max(2, Math.min(6, Math.round(total*0.25)));
  const indices = shuffleArr([...Array(total).keys()].filter(i=>words[i].length>3)).slice(0,n);
  const blanks = {};
  indices.forEach(i=>{ blanks[i]=words[i].replace(/[.,!?;:]/g,''); });

  pg.innerHTML = hdr + `
<div class="exhdr">
  <div class="extype">✏️ Preencha as Lacunas</div>
  <div class="extit">${prayer.title}</div>
  <div class="extip">Complete as palavras que faltam na oração</div>
</div>
<div class="ptxt">${words.map((w,i)=>
  indices.includes(i)
    ? `<input class="blank" id="b${i}" placeholder="___" data-ans="${blanks[i]}" autocomplete="off" spellcheck="false">`
    : w
).join(' ')}</div>
<div class="psrc">— ${prayer.src}</div>
<button class="btn btn-p" onclick="checkLacunas(${JSON.stringify(indices)}, ${prayer.id})" style="margin-top:10px">Verificar</button>`;
}

function checkLacunas(indices, prayerId){
  let ok=0;
  indices.forEach(i=>{
    const inp=document.getElementById('b'+i);
    if(!inp) return;
    const ans=inp.dataset.ans.toLowerCase().replace(/[.,!?;:]/g,'');
    const val=inp.value.trim().toLowerCase().replace(/[.,!?;:]/g,'');
    if(val===ans||levenshtein(val,ans)<=1){ inp.style.color='var(--ok)'; inp.style.borderColor='var(--ok)'; ok++; }
    else { inp.style.color='var(--err)'; inp.style.borderColor='var(--err)'; inp.value=inp.dataset.ans; }
  });
  const correct = ok === indices.length;
  recordResult(prayerId, correct);
  if(correct){ setTimeout(()=>{ EX.idx++; nextExercise(); }, 900); }
  else { showRetryButtons(); }
}

// ─── ORDEM ───────────────────────────────────────
function ordem(pg, hdr, prayer){
  const sentences = prayer.text.split(/(?<=[.!?])\s+/).slice(0,3);
  const target = sentences[Math.floor(Math.random()*sentences.length)].replace(/[.!?,;]/g,'').trim();
  const words = shuffleArr(target.split(' ').filter(w=>w.length>0));

  pg.innerHTML = hdr + `
<div class="exhdr">
  <div class="extype">🔀 Ordene as Palavras</div>
  <div class="extit">${prayer.title}</div>
  <div class="extip">Toque nas palavras na ordem correta</div>
</div>
<div class="psrc" style="text-align:left;margin-bottom:8px">— ${prayer.src}</div>
<div class="azone" id="azone" style="min-height:48px"></div>
<div class="wbank" id="wbank">${words.map((w,i)=>`<div class="wc" onclick="pickWord(${i},this)" id="ww${i}">${w}</div>`).join('')}</div>
<div id="ordFb"></div>
<button class="btn btn-p" onclick="checkOrdem(${JSON.stringify(target.split(' '))},${prayer.id})" style="margin-top:10px">Verificar</button>`;
  window._ordWords = []; window._ordWordIds = [];
}

function pickWord(idx, el){
  if(el.classList.contains('sel')) return;
  el.classList.add('sel');
  const word = el.textContent;
  window._ordWords.push(word);
  window._ordWordIds.push(idx);
  const div = document.createElement('div');
  div.className = 'wc sel';
  div.textContent = word;
  div.dataset.idx = idx;
  div.onclick = function(){ removeWord(idx, this); };
  document.getElementById('azone').appendChild(div);
}

function removeWord(idx, azoneEl){
  const ww = document.getElementById('ww'+idx);
  if(ww) ww.classList.remove('sel');
  if(azoneEl && azoneEl.parentNode) azoneEl.parentNode.removeChild(azoneEl);
  const pos = window._ordWordIds.lastIndexOf(idx);
  if(pos !== -1){ window._ordWords.splice(pos,1); window._ordWordIds.splice(pos,1); }
}

function checkOrdem(target, prayerId){
  const given = window._ordWords.map(w=>w.toLowerCase().replace(/[.,!?;:]/g,''));
  const tgt = target.map(w=>w.toLowerCase().replace(/[.,!?;:]/g,''));
  const correct = given.length===tgt.length && given.every((w,i)=>w===tgt[i]||levenshtein(w,tgt[i])<=1);
  recordResult(prayerId, correct);
  if(correct){ setTimeout(()=>{ EX.idx++; nextExercise(); }, 900); }
  else {
    document.getElementById('ordFb').innerHTML=`<div class="feedback-box bad">✗ Ordem correta: <em>${target.join(' ')}</em></div>`;
    showRetryButtons();
  }
}

// ─── MÚLTIPLA ESCOLHA ────────────────────────────
function multipla(pg, hdr, prayer){
  const sentences = prayer.text.split(/(?<=[.!?])\s+/);
  const idx = Math.min(Math.floor(Math.random()*(sentences.length-1)), sentences.length-2);
  const prompt = sentences.slice(0,idx+1).join(' ');
  const correct = sentences[idx+1] || sentences[0];
  const otherPrayers = PRAYERS.filter(p=>p.id!==prayer.id);
  const wrongs = shuffleArr(otherPrayers).slice(0,3).map(p=>{
    const s=p.text.split(/(?<=[.!?])\s+/);
    return s[Math.floor(Math.random()*s.length)];
  });
  const options = shuffleArr([correct,...wrongs]).slice(0,4);

  pg.innerHTML = hdr + `
<div class="exhdr">
  <div class="extype">🎯 Múltipla Escolha</div>
  <div class="extit">${prayer.title}</div>
  <div class="extip">Como continua esta oração?</div>
</div>
<div class="ptxt">"${prompt}<span style="color:var(--a)"> _____</span>"</div>
<div class="psrc">— ${prayer.src}</div>
<div class="cg">
${options.map((opt,i)=>`<div class="cb" onclick="checkMultipla(this,'${escQ(opt)}','${escQ(correct)}',${ prayer.id})">${opt}</div>`).join('')}
</div>`;
}

function checkMultipla(el, chosen, correct, prayerId){
  if(el.style.pointerEvents==='none') return;
  document.querySelectorAll('.cb').forEach(b=>b.style.pointerEvents='none');
  const ok = chosen===correct;
  el.classList.add(ok?'ok2':'bad');
  if(!ok) document.querySelectorAll('.cb').forEach(b=>{ if(b.textContent.trim()===correct) b.classList.add('ok2'); });
  recordResult(prayerId, ok);
  if(ok){ setTimeout(()=>{ EX.idx++; nextExercise(); }, 900); }
  else { showRetryButtons(); }
}

// ─── DIGITAÇÃO ───────────────────────────────────
function digitacao(pg, hdr, prayer){
  pg.innerHTML = hdr + `
<div class="exhdr">
  <div class="extype">⌨️ Escreva de Memória</div>
  <div class="extit">${prayer.title}</div>
  <div class="extip">Escreva esta oração de memória. Use dicas se precisar.</div>
</div>
<div style="margin-bottom:8px;font-size:13px;color:var(--tm)">— ${prayer.src}</div>
<button class="hint-btn" onclick="showHint('${escQ(prayer.text.split(' ').slice(0,8).join(' '))}...')">💡 Dica (primeiras palavras)</button>
<div id="hintBox"></div>
<textarea class="ta" id="digTa" placeholder="Escreva a oração aqui..." rows="5"></textarea>
<button class="btn btn-p" onclick="checkDigitacao(${JSON.stringify(prayer.text)},${prayer.id})" style="margin-top:10px">Verificar</button>`;
}

function showHint(hint){ document.getElementById('hintBox').innerHTML=`<div class="feedback-box ok" style="font-size:13px;margin-bottom:8px">💡 ${hint}</div>`; }

function checkDigitacao(correct, prayerId){
  const val = document.getElementById('digTa').value.trim();
  const sim = similarity(val, correct);
  const ok = sim >= 0.65;
  const words = correct.split(' ');
  const given = val.split(' ');
  let diff = words.map((w,i)=>{
    const gw = given[i]||'';
    const wc = w.replace(/[.,!?;:]/g,'').toLowerCase();
    const gc = gw.replace(/[.,!?;:]/g,'').toLowerCase();
    if(gc===wc||levenshtein(gc,wc)<=1) return `<span class="ok2">${w}</span>`;
    if(!gw) return `<span class="mis">[${w}]</span>`;
    return `<span class="bad">${gw}</span> <span class="mis">[${w}]</span>`;
  }).join(' ');
  const ta = document.getElementById('digTa');
  ta.style.display='none';
  const el = document.createElement('div');
  el.className='type-diff ptxt'; el.innerHTML=diff;
  ta.parentNode.insertBefore(el, ta);
  const pct = Math.round(sim*100);
  const fb = document.createElement('div');
  fb.className=`feedback-box ${ok?'ok':'bad'}`;
  fb.textContent = ok ? `✓ ${pct}% correto! Ótimo!` : `✗ ${pct}% — veja o que errou acima`;
  ta.parentNode.insertBefore(fb, ta);
  recordResult(prayerId, ok);
  if(ok){ setTimeout(()=>{ EX.idx++; nextExercise(); }, 1200); }
  else { showRetryButtons(); }
}

// ─── PROGRESSIVO ─────────────────────────────────
function progressivo(pg, hdr, prayer){
  const words = prayer.text.split(' ');
  let revealed = Math.max(3, Math.floor(words.length*0.3));
  window._progWords = words;
  window._progRevealed = revealed;

  function renderProg(){
    const display = words.map((w,i)=>i<revealed?w:'<span style="color:var(--a)">___</span>').join(' ');
    document.getElementById('progText').innerHTML=display;
    document.getElementById('progCount').textContent=`${revealed}/${words.length} palavras visíveis`;
  }

  pg.innerHTML = hdr + `
<div class="exhdr">
  <div class="extype">👁️ Memorização Progressiva</div>
  <div class="extit">${prayer.title}</div>
  <div class="extip">Tente completar mentalmente as partes ocultas</div>
</div>
<div id="progText" class="ptxt"></div>
<div id="progCount" style="font-size:12px;color:var(--tm);text-align:right;margin-top:4px"></div>
<div class="psrc">— ${prayer.src}</div>
<div style="display:flex;gap:8px;margin-top:12px">
  <button class="btn btn-s" onclick="revealMore()" style="flex:1">👁️ Revelar mais</button>
  <button class="btn btn-s" onclick="hideMore()" style="flex:1">🙈 Ocultar mais</button>
</div>
<button class="btn btn-p" onclick="recordResult(${prayer.id},true);EX.idx++;nextExercise();" style="margin-top:10px">✓ Estudei esta oração</button>`;

  window._progRenderFn = renderProg;
  renderProg();
}

function revealMore(){
  window._progRevealed = Math.min(window._progWords.length, window._progRevealed+3);
  window._progRenderFn();
}
function hideMore(){
  window._progRevealed = Math.max(2, window._progRevealed-3);
  window._progRenderFn();
}

// ─── CRONÔMETRO ──────────────────────────────────
function cronometro(pg, hdr, prayer){
  let timeLeft = Math.max(60, prayer.text.split(' ').length*2.5|0);
  let interval;

  pg.innerHTML = hdr + `
<div class="exhdr">
  <div class="extype">⏱️ Contra o Tempo</div>
  <div class="extit">${prayer.title}</div>
  <div class="extip">Digite a oração antes do tempo acabar!</div>
</div>
<div class="timer" id="chrono">${timeLeft}s</div>
<textarea class="ta" id="cronTa" placeholder="Escreva a oração aqui..." rows="4"></textarea>
<button class="btn btn-p" id="startCron" onclick="startCronometro(${timeLeft},${prayer.id})" style="margin-top:10px">▶ Iniciar Cronômetro</button>
<div id="cronFb"></div>`;
}

function startCronometro(total, prayerId){
  document.getElementById('startCron').style.display='none';
  let left=total;
  const ch=document.getElementById('chrono');
  const iv=setInterval(()=>{
    left--;ch.textContent=left+'s';
    if(left<=10) ch.classList.add('red');
    if(left<=0){ clearInterval(iv); finishCron(prayerId); }
  },1000);
  window._cronInterval=iv;
}

function finishCron(prayerId){
  const ta=document.getElementById('cronTa');
  const val=ta?ta.value.trim():'';
  const prayer=PRAYERS.find(p=>p.id===prayerId);
  const sim=prayer?similarity(val,prayer.text):0;
  const ok=sim>=0.5;
  if(ta) ta.disabled=true;
  document.getElementById('cronFb').innerHTML=`<div class="feedback-box ${ok?'ok':'bad'}">${ok?'✓ Parabéns! '+Math.round(sim*100)+'% de precisão!':'⏰ Tempo! '+Math.round(sim*100)+'% — veja o texto abaixo'}</div>`;
  if(!ok && ta){ const orig=PRAYERS.find(p=>p.id===prayerId); if(orig){ const show=document.createElement('div'); show.className='feedback-box bad'; show.style.fontSize='13px'; show.textContent='Texto: '+orig.text.slice(0,120)+'…'; document.getElementById('cronFb').appendChild(show); } }
  recordResult(prayerId, ok);
  if(ok){ setTimeout(()=>{ EX.idx++; nextExercise(); }, 1200); }
  else { showRetryButtons(); }
}

// ─── PAREAR ──────────────────────────────────────
function parear(pg, hdr, prayer){
  const others = shuffleArr(PRAYERS.filter(p=>p.id!==prayer.id)).slice(0,3);
  const group = shuffleArr([prayer,...others]);
  const titles = shuffleArr(group.map(p=>({id:p.id,text:p.title})));
  const openings = shuffleArr(group.map(p=>({id:p.id,text:p.text.split(' ').slice(0,7).join(' ')+'…'})));

  window._parear = { matched:new Set(), group, prayerId:prayer.id, selected:null };

  pg.innerHTML = hdr + `
<div class="exhdr">
  <div class="extype">🔗 Conecte os Pares</div>
  <div class="extit">Título → Início da oração</div>
  <div class="extip">Toque um título e depois o início correspondente</div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
  <div id="par-titles">${titles.map(t=>`<div class="wc" id="par-t-${t.id}" onclick="parearTap('t',${t.id},this)" style="margin-bottom:8px;padding:10px;font-size:12px;text-align:center;cursor:pointer">${t.text}</div>`).join('')}</div>
  <div id="par-openings">${openings.map(o=>`<div class="wc" id="par-o-${o.id}" onclick="parearTap('o',${o.id},this)" style="margin-bottom:8px;padding:10px;font-size:11px;color:var(--tm);text-align:center;cursor:pointer">${o.text}</div>`).join('')}</div>
</div>`;
}

function parearTap(side, id, el){
  const P = window._parear;
  if(!P || P.matched.has(id)) return;
  if(!P.selected){
    P.selected = {side, id, el};
    el.style.borderColor='var(--a)'; el.style.background='rgba(227,179,65,0.2)';
  } else {
    const prev = P.selected; P.selected = null;
    if(prev.side === side){
      prev.el.style.borderColor=''; prev.el.style.background='';
      P.selected = {side, id, el};
      el.style.borderColor='var(--a)'; el.style.background='rgba(227,179,65,0.2)';
      return;
    }
    const ok = prev.id === id;
    if(ok){
      [prev.el, el].forEach(e=>{ e.style.borderColor='var(--ok)'; e.style.background='rgba(86,211,100,0.15)'; e.onclick=null; });
      P.matched.add(id);
      if(P.matched.size >= P.group.length){
        toast('🎉 Todos os pares encontrados!','ok');
        recordResult(P.prayerId, true, 5);
        setTimeout(()=>{ EX.idx++; nextExercise(); }, 1500);
      }
    } else {
      [prev.el, el].forEach(e=>{ e.style.borderColor='var(--err)'; e.style.background='rgba(248,81,73,0.15)'; });
      setTimeout(()=>{ [prev.el, el].forEach(e=>{ e.style.borderColor=''; e.style.background=''; }); }, 800);
    }
  }
}

// ─── ECO ─────────────────────────────────────────
function eco(pg, hdr, prayer){
  const text = prayer.text.split(/(?<=[.!?])\s+/).slice(0,3).join(' ');
  const readTime = Math.max(6, Math.min(15, Math.floor(text.split(' ').length/2)));

  pg.innerHTML = hdr + `
<div class="exhdr">
  <div class="extype">🧠 Memória Eco</div>
  <div class="extit">${prayer.title}</div>
  <div class="extip">Leia com atenção — o texto vai desaparecer!</div>
</div>
<div id="ecoText" class="ptxt">${text}</div>
<div class="psrc">— ${prayer.src}</div>
<div id="ecoTimer" style="text-align:center;font-size:28px;font-weight:bold;color:var(--a);margin:8px 0">${readTime}s</div>
<div id="ecoInput" style="display:none">
  <div style="color:var(--tm);font-size:13px;margin-bottom:8px">Reproduza o que você memorizou:</div>
  <textarea class="ta" id="ecoTa" placeholder="Escreva a oração de memória..." rows="5"></textarea>
  <button class="btn btn-p" onclick="checkEco(${JSON.stringify(text)},${prayer.id})" style="margin-top:10px">Verificar</button>
</div>`;

  let left = readTime;
  const iv = setInterval(()=>{
    left--;
    const t = document.getElementById('ecoTimer');
    if(!t){ clearInterval(iv); return; }
    t.textContent = left+'s';
    if(left <= 0){
      clearInterval(iv);
      const txt = document.getElementById('ecoText'); if(txt) txt.style.display='none';
      t.style.display='none';
      const inp = document.getElementById('ecoInput');
      if(inp){ inp.style.display=''; const ta=document.getElementById('ecoTa'); if(ta) ta.focus(); }
    }
  }, 1000);
  window._ecoInterval = iv;
}

function checkEco(correct, prayerId){
  const val = document.getElementById('ecoTa').value.trim();
  const sim = similarity(val, correct);
  const ok = sim >= 0.55;
  const pct = Math.round(sim*100);
  document.getElementById('ecoTa').style.display='none';
  const fb = document.createElement('div');
  fb.className=`feedback-box ${ok?'ok':'bad'}`;
  fb.innerHTML = ok ? `✓ ${pct}% memorizado! Ótimo!` : `✗ ${pct}% — Texto completo:<br><em style="font-size:12px">${correct}</em>`;
  document.getElementById('pgEx').appendChild(fb);
  recordResult(prayerId, ok);
  if(ok){ setTimeout(()=>{ EX.idx++; nextExercise(); }, 1200); }
  else { showRetryButtons(); }
}

<div class="sgrid">

  <div class="sc"><div class="sn">${mastered}</div><div class="sl">Memorizadas</div></div>

</div>

<div class="card">
  <div class="ct">Nível ${lvl} ${lvl>=10?'🏆':lvl>=5?'⭐':''}</div>
  <div style="font-size:13px;color:var(--tm);margin-bottom:6px">${ST.xp}/${xpToNext} XP para nível ${lvl+1}</div>
  <div class="pb"><div class="pf" style="width:${Math.min(100,xpProg)}%"></div></div>

  <div class="ct" style="margin-bottom:10px">Últimos 28 Dias</div>
  <div class="dcal">${days.map(d=>`<div class="dd${d.done?d.good?' done':' part':''}"></div>`).join('')}</div>
  <div style="display:flex;gap:16px;font-size:11px;color:var(--tm);margin-top:6px">
    <span><span class="dd done" style="display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:2px"></span>Completo</span>
    <span><span class="dd part" style="display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:2px"></span>Parcial</span>
  </div>
</div>

<div class="card">
  <div class="ct" style="margin-bottom:12px">Progresso por Categoria</div>
  ${catStats.map(c=>`
  <div class="prog-bar-row">

function recordResult(prayerId, ok, quality){
  const q = quality !== undefined ? quality : (ok ? 4 : 1);
  const pd=getPD(prayerId);
  sm2(pd,q);
  ST.totalEx++; if(ok) ST.totalCorrect++;
  ST.todayDone++;
  ST.history.push({ts:Date.now(),id:prayerId,ok,type:EX?.type||'auto'});
  if(ST.history.length>500) ST.history=ST.history.slice(-500);
  saveState();
  if(ok) addXP(10, 300, 200);
  document.getElementById('hStreak').textContent=ST.streak;
  document.getElementById('hXP').textContent=ST.xp;
}

function shuffleArr(a){ return a.slice().sort(()=>Math.random()-.5); }

function levenshtein(a,b){
  if(!a||!b) return Math.max((a||'').length,(b||'').length);
  const m=a.length,n=b.length,dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i||j));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}

function similarity(a,b){
  if(!a||!b) return 0;
  const wa=a.toLowerCase().replace(/[.,!?;:]/g,'').split(/\s+/).filter(Boolean);
  const wb=b.toLowerCase().replace(/[.,!?;:]/g,'').split(/\s+/).filter(Boolean);
  if(!wb.length) return 0;
  let matches=0;
  wa.forEach(w=>{ if(wb.some(x=>levenshtein(w,x)<=Math.max(1,Math.floor(w.length*.25)))) matches++; });
  return matches/wb.length;
}

function escQ(s){ return (s||'').replace(/'/g,"\\'").replace(/"/g,'\\"'); }
