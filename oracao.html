<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oratio — Aprenda a Orar</title>
<style>
:root{--p:#1a237e;--pl:#283593;--a:#ffd700;--al:#fff176;--bg:#0d1117;--s:#161b22;--s2:#21262d;--t:#e6edf3;--tm:#8b949e;--ok:#56d364;--err:#f85149;--warn:#e3b341;--bd:#30363d;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;overflow-x:hidden;}
#app{max-width:768px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.hdr{background:linear-gradient(135deg,var(--p) 0%,#4a148c 100%);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.hdr-logo{font-size:20px;font-weight:700;color:var(--a);letter-spacing:1px;}
.hdr-stats{display:flex;gap:12px;align-items:center;}
.spill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border-radius:20px;padding:5px 12px;font-size:14px;font-weight:600;}
.spill span{color:var(--a);}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:768px;background:var(--s);border-top:1px solid var(--bd);display:flex;z-index:100;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 8px;cursor:pointer;color:var(--tm);transition:color .2s;font-size:11px;gap:3px;}
.ni.on{color:var(--a);}
.ni svg{width:22px;height:22px;}
.pg{flex:1;padding:20px 16px 86px;display:none;}
.pg.on{display:block;}
.card{background:var(--s);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:14px;}
.ct{font-size:17px;font-weight:700;margin-bottom:6px;color:var(--a);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:12px;border:none;cursor:pointer;font-size:15px;font-weight:600;transition:all .2s;width:100%;}
.btn-p{background:linear-gradient(135deg,var(--a),#ff8f00);color:#111;}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,215,0,.3);}
.btn-s{background:var(--s2);color:var(--t);border:1px solid var(--bd);}
.btn-sm{width:auto;padding:8px 16px;font-size:13px;}
.pb{height:8px;background:var(--s2);border-radius:4px;overflow:hidden;margin:8px 0;}
.pf{height:100%;background:linear-gradient(90deg,var(--a),#ff8f00);border-radius:4px;transition:width .5s ease;}
.ptxt{font-size:17px;line-height:1.85;background:var(--s2);padding:18px;border-radius:12px;text-align:left;margin:14px 0;font-style:italic;border-left:4px solid var(--a);}
.psrc{color:var(--a);font-size:12px;text-align:right;margin-top:6px;}
.blank{display:inline-block;border:none;border-bottom:3px solid var(--a);background:transparent;color:var(--a);font-size:17px;font-style:italic;min-width:70px;text-align:center;outline:none;padding:1px 4px;}
.blank:focus{background:rgba(255,215,0,.1);border-radius:4px 4px 0 0;}
.wbank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0;}
.wc{padding:7px 14px;background:var(--pl);color:var(--t);border:2px solid var(--p);border-radius:20px;cursor:pointer;font-size:14px;transition:all .2s;user-select:none;}
.wc:hover{border-color:var(--a);color:var(--a);}
.wc.sel{opacity:.35;cursor:default;}
.wc.ok2{background:rgba(86,211,100,.2);border-color:var(--ok);color:var(--ok);}
.wc.bad{background:rgba(248,81,73,.2);border-color:var(--err);color:var(--err);}
.azone{min-height:72px;background:var(--s2);border:2px dashed var(--bd);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin:14px 0;}
.azone .wc{background:rgba(26,35,126,.5);cursor:pointer;}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.cb{padding:14px;background:var(--s2);border:2px solid var(--bd);border-radius:12px;cursor:pointer;font-size:14px;color:var(--t);text-align:center;transition:all .2s;line-height:1.4;}
.cb:hover{border-color:var(--a);}
.cb.ok2{background:rgba(86,211,100,.15);border-color:var(--ok);color:var(--ok);}
.cb.bad{background:rgba(248,81,73,.15);border-color:var(--err);color:var(--err);}
.fc{perspective:1000px;height:260px;cursor:pointer;margin:18px 0;}
.fci{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d;}
.fc.flip .fci{transform:rotateY(180deg);}
.fcf,.fcb{position:absolute;width:100%;height:100%;backface-visibility:hidden;background:linear-gradient(135deg,var(--p),#4a148c);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;border:1px solid rgba(255,215,0,.3);}
.fcb{transform:rotateY(180deg);}
.fcl{font-size:11px;color:rgba(255,215,0,.6);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;}
.fcc{font-size:18px;font-weight:700;color:var(--t);text-align:center;line-height:1.4;}
.fcs{font-size:13px;color:var(--tm);margin-top:10px;font-style:italic;}
.rb{display:flex;gap:8px;margin:14px 0;}
.rbtn{flex:1;padding:11px;border:none;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;}
.ta{width:100%;min-height:110px;background:var(--s2);border:2px solid var(--bd);border-radius:12px;padding:14px;font-size:15px;color:var(--t);font-family:inherit;resize:none;outline:none;line-height:1.6;transition:border-color .2s;}
.ta:focus{border-color:var(--a);}
.timer{font-size:48px;font-weight:700;color:var(--a);text-align:center;font-variant-numeric:tabular-nums;margin:14px 0;}
.timer.red{color:var(--err);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.catg{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.catc{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:18px 14px;cursor:pointer;transition:all .2s;text-align:center;}
.catc:hover{border-color:var(--a);transform:translateY(-2px);}
.catic{font-size:30px;margin-bottom:6px;}
.catn{font-weight:600;font-size:13px;}
.catk{color:var(--tm);font-size:11px;margin-top:3px;}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.sc{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:18px;text-align:center;}
.sn{font-size:30px;font-weight:700;color:var(--a);}
.sl{font-size:11px;color:var(--tm);margin-top:3px;text-transform:uppercase;letter-spacing:.5px;}
.dcal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:10px 0;}
.dd{aspect-ratio:1;border-radius:3px;background:var(--s2);}
.dd.done{background:var(--a);}
.dd.part{background:#b8860b;}
.toast{position:fixed;top:75px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:11px 22px;font-weight:600;z-index:1000;transition:transform .4s cubic-bezier(.175,.885,.32,1.275);white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{border-color:var(--ok);color:var(--ok);}
.toast.bad{border-color:var(--err);color:var(--err);}
.pli{background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:9px;cursor:pointer;transition:border-color .2s;}
.pli:hover{border-color:var(--a);}
.plt{font-weight:600;margin-bottom:3px;}
.plp{color:var(--tm);font-size:12px;line-height:1.4;}
.plm{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;background:rgba(255,215,0,.15);color:var(--a);}
.diffbar{display:flex;gap:3px;margin-top:5px;}
.star{font-size:10px;color:var(--bd);}
.star.on{color:var(--a);}
.exhdr{text-align:center;margin-bottom:18px;}
.extype{font-size:12px;color:var(--tm);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.extit{font-size:20px;font-weight:700;}
.extip{font-size:13px;color:var(--tm);margin-top:6px;}
.complete{text-align:center;padding:40px 20px;}
.cmp-ico{font-size:68px;margin-bottom:14px;}
.cmp-t{font-size:26px;font-weight:700;color:var(--a);}
.cmp-s{color:var(--tm);margin:6px 0 22px;font-size:15px;}
.xpp{position:fixed;color:var(--a);font-weight:700;font-size:18px;pointer-events:none;animation:xpf 1.5s ease-out forwards;z-index:999;}
@keyframes xpf{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-45px);}}
.prog-bar-row{margin-bottom:10px;}
.prog-lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
.prog-lbl span{color:var(--tm);}
.hint-btn{background:none;border:1px solid var(--bd);color:var(--tm);border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;margin-bottom:10px;}
.hint-btn:hover{border-color:var(--a);color:var(--a);}
.feedback-box{border-radius:12px;padding:16px;margin:12px 0;text-align:left;font-size:14px;line-height:1.7;}
.feedback-box.ok{background:rgba(86,211,100,.1);border:1px solid var(--ok);}
.feedback-box.bad{background:rgba(248,81,73,.1);border:1px solid var(--err);}
.type-diff span.ok2{color:var(--ok);}
.type-diff span.bad{color:var(--err);text-decoration:line-through;}
.type-diff span.mis{color:var(--warn);font-style:italic;}
.lv-badge{display:inline-block;background:linear-gradient(135deg,var(--a),#ff8f00);color:#111;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700;margin-left:8px;}
.pub-box{background:linear-gradient(135deg,#1a237e,#4a148c);border-radius:16px;padding:22px;text-align:center;border:1px solid rgba(255,215,0,.2);}
.pub-timer{font-size:56px;font-weight:700;color:#fff;margin:16px 0;}
.pub-txt{font-size:16px;line-height:1.8;color:#e8d5ff;font-style:italic;text-align:left;background:rgba(255,255,255,.08);border-radius:10px;padding:16px;margin:14px 0;}
.streak-fire{font-size:48px;margin-bottom:8px;}
.daily-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.daily-pct{font-size:28px;font-weight:700;color:var(--a);}
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ex-card{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:16px;cursor:pointer;transition:all .2s;text-align:center;}
.ex-card:hover{border-color:var(--a);transform:translateY(-2px);}
.ex-ico{font-size:28px;margin-bottom:6px;}
.ex-nm{font-weight:600;font-size:13px;}
.ex-ds{color:var(--tm);font-size:11px;margin-top:3px;}
.sep{height:1px;background:var(--bd);margin:16px 0;}
.badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.badge{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;font-size:12px;text-align:center;}
.badge.earned{background:rgba(255,215,0,.1);border-color:var(--a);color:var(--a);}
.back-btn{background:none;border:none;color:var(--tm);cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px;margin-bottom:16px;padding:0;}
.back-btn:hover{color:var(--t);}
select{background:var(--s2);border:1px solid var(--bd);color:var(--t);border-radius:8px;padding:8px 12px;font-size:14px;outline:none;cursor:pointer;}
select:focus{border-color:var(--a);}
@media(max-width:480px){.catg,.ex-grid{grid-template-columns:1fr 1fr;}.cg{grid-template-columns:1fr;}}
</style>
</head>
<body>

    </div>
  </nav>

<script>
// ═══════════════════════════════════════════════════
// BANCO DE ORAÇÕES
// ═══════════════════════════════════════════════════
const CATS = {
  grandes_oracoes:{label:'Grandes Orações Bíblicas',icon:'📖'},
  manha:{label:'Orações da Manhã',icon:'🌅'},
  noite:{label:'Orações da Noite',icon:'🌙'},
  familia:{label:'Pela Família',icon:'👨‍👩‍👧‍👦'},
  enfermos:{label:'Por Enfermos e Cura',icon:'💊'},
  trabalho:{label:'Trabalho e Provisão',icon:'💼'},
  protecao:{label:'Proteção Espiritual',icon:'🛡️'},
  louvor:{label:'Louvor e Adoração',icon:'🙌'},
  gratidao:{label:'Gratidão',icon:'🙏'},
  forca:{label:'Força e Coragem',icon:'💪'},
  sabedoria:{label:'Sabedoria e Guia',icon:'🌟'},
  consagracao:{label:'Consagração e Rendição',icon:'✝️'},
  penitencia:{label:'Arrependimento e Perdão',icon:'❤️'},
  orar_publico:{label:'Orar em Público',icon:'🎤'},
  intercecao:{label:'Intercessão',icon:'⚡'},
  paz:{label:'Paz Interior',icon:'☮️'},
  anseio:{label:'Busca de Deus',icon:'🔥'},
};

const PRAYERS = [
// ─── ORAÇÕES FUNDAMENTAIS ────────────────────────
{id:1,title:'Pai Nosso',text:'Pai nosso que estás nos céus, santificado seja o teu nome, venha o teu reino, seja feita a tua vontade, assim na terra como no céu. Dá-nos hoje o nosso pão de cada dia. Perdoa-nos as nossas dívidas, assim como nós perdoamos aos nossos devedores. E não nos deixes cair em tentação, mas livra-nos do mal, pois teus são o reino, o poder e a glória para sempre. Amém.',cat:'grandes_oracoes',src:'Mateus 6:9-13 (NVI)',dif:2,tags:['jesus','modelo','fundamental']},
{id:2,title:'O Senhor é o Meu Pastor (Salmo 23)',text:'O Senhor é o meu pastor; nada me faltará. Em verdes pastagens ele me faz repousar. Guia-me junto a águas tranquilas, restaura-me o ânimo. Pelos caminhos da justiça ele me guia por amor do seu nome. Mesmo que eu ande pelo vale da sombra da morte, não temerei mal algum, pois tu estás comigo; teu cajado e teu bordão me consolam. Tu me preparas uma mesa na presença dos meus inimigos. Derrama unção sobre a minha cabeça; meu cálice transborda. Certamente a bondade e o amor me acompanharão todos os dias da minha vida, e eu habitarei na casa do Senhor para sempre.',cat:'forca',src:'Salmo 23 (NVI)',dif:3,tags:['salmo','pastor','confiança']},
{id:3,title:'Proteção do Altíssimo (Salmo 91)',text:'Aquele que habita no abrigo do Altíssimo e descansa à sombra do Todo-Poderoso pode dizer ao Senhor: Tu és o meu refúgio e a minha fortaleza, o meu Deus, em quem confio. Ele te livrará da armadilha do caçador e da peste destruidora. Ele te cobrirá com as suas penas, e sob as suas asas você encontrará refúgio; a sua fidelidade é escudo e proteção. Você não temerá os terrores da noite, nem a flecha que voa de dia, nem a peste que avança nas trevas, nem a epidemia que devasta ao meio-dia. Pois ele ordenará que os seus anjos guardem você em todos os seus caminhos.',cat:'protecao',src:'Salmo 91 (NVI)',dif:4,tags:['salmo','anjos','segurança']},
{id:4,title:'Deus é o Nosso Refúgio (Salmo 46)',text:'Deus é o nosso refúgio e a nossa força, socorro bem-presente na angústia. Por isso não temeremos, mesmo que a terra se abale e os montes se precipitem para o fundo do mar, mesmo que as águas ruam e se agitem e os montes sejam abalados pelo seu furor. O Senhor dos Exércitos está conosco; o Deus de Jacó é o nosso baluarte.',cat:'protecao',src:'Salmo 46:1-3,7 (NVI)',dif:2,tags:['salmo','força','refúgio']},
{id:5,title:'O Senhor é a Minha Luz (Salmo 27)',text:'O Senhor é a minha luz e a minha salvação; a quem temerei? O Senhor é o protetor da minha vida; a quem me recearei? Quando os ímpios avançam contra mim para devorar a minha carne, são eles mesmos que tropeçam e caem. Mesmo que um exército se acampe contra mim, o meu coração não temerá. Uma coisa peço ao Senhor, e é essa que busco: que eu possa habitar na casa do Senhor todos os dias da minha vida.',cat:'forca',src:'Salmo 27:1-4 (NVI)',dif:3,tags:['salmo','coragem','luz']},
{id:6,title:'Magnificat — Oração de Maria',text:'A minha alma glorifica o Senhor, e o meu espírito se alegra em Deus, meu Salvador, pois olhou com bondade para a humildade da sua serva. Por isso, todas as gerações me chamarão bendita. O Todo-Poderoso fez grandes coisas por mim. Santo é o seu nome. A sua misericórdia se estende de geração em geração sobre os que o temem. Ele realizou proezas com o seu braço; dispersou os que são arrogantes em seus próprios pensamentos.',cat:'grandes_oracoes',src:'Lucas 1:46-51 (NVI)',dif:3,tags:['maria','louvor','alegria']},
{id:7,title:'Oração Sacerdotal de Jesus',text:'Pai, chegou a hora. Glorifica o teu Filho, para que o Filho te glorifique. Pois tu lhe deste autoridade sobre toda a humanidade para que ele conceda a vida eterna a todos os que tu lhe deste. E a vida eterna é esta: que te conheçam a ti, o único Deus verdadeiro, e a Jesus Cristo, a quem enviaste. Eu te glorifiquei na terra, concluindo a obra que me confiaste.',cat:'grandes_oracoes',src:'João 17:1-4 (NVI)',dif:4,tags:['jesus','glorificação','missão']},
{id:8,title:'Força Interior — Paulo aos Efésios',text:'Por essa razão me ponho de joelhos diante do Pai, de quem toma o nome toda família no céu e na terra. Peço-lhe que, das gloriosas riquezas da sua graça, os fortifique com poder por meio do seu Espírito no homem interior, para que Cristo habite nos seus corações pela fé. E peço que vocês, tendo raízes e fundamentos no amor, possam compreender, juntamente com todos os santos, qual é a largura, o comprimento, a altura e a profundidade do amor de Cristo, e que possam conhecer esse amor que excede todo o conhecimento.',cat:'forca',src:'Efésios 3:14-19 (NVI)',dif:4,tags:['paulo','força','amor']},
{id:9,title:'A Paz de Deus',text:'Não andem ansiosos por coisa alguma, mas em tudo, pela oração e súplicas, e com ação de graças, apresentem seus pedidos a Deus. E a paz de Deus, que excede todo o entendimento, guardará os seus corações e as suas mentes em Cristo Jesus.',cat:'paz',src:'Filipenses 4:6-7 (NVI)',dif:2,tags:['paulo','paz','ansiedade']},
{id:10,title:'Oração de Salomão — Dedicação do Templo',text:'Senhor, Deus de Israel, não há Deus como tu, nem no céu acima nem na terra abaixo! Cumpres a aliança e mostras amor a teus servos que caminham diante de ti de todo o seu coração. Que os teus olhos fiquem abertos para esta casa noite e dia, para este lugar do qual disseste: o meu nome estará ali, para que ouças a oração que o teu servo fizer voltado para este lugar. Ouve a súplica do teu servo e do teu povo quando eles orarem voltados para este lugar.',cat:'grandes_oracoes',src:'1 Reis 8:23-29 (NVI)',dif:3,tags:['salomão','templo','pacto']},
{id:11,title:'Oração de Daniel',text:'Senhor, Deus grande e temível, que cumpres a tua aliança de amor com todos os que te amam e obedecem aos teus mandamentos, pecamos e fizemos o mal, agimos de modo perverso e rebelde; nos afastamos dos teus mandamentos e das tuas leis. A ti, Senhor, pertence a justiça; a nós pertence hoje a vergonha. Do Senhor, nosso Deus, vêm a misericórdia e o perdão, embora nos tenhamos rebelado contra ele. Inclina, ó meu Deus, o teu ouvido e ouve.',cat:'grandes_oracoes',src:'Daniel 9:4-9,18 (NVI)',dif:4,tags:['daniel','confissão','misericórdia']},
{id:12,title:'Oração da Serenidade',text:'Senhor, concedei-me a serenidade necessária para aceitar as coisas que não posso modificar. Coragem para modificar as que posso. E sabedoria para distinguir umas das outras. Vivendo um dia de cada vez, desfrutando um momento de cada vez. Aceitando as privações como um caminho para a paz. Confiando que fareis tudo certo se eu me render à vossa vontade.',cat:'sabedoria',src:'Reinhold Niebuhr',dif:2,tags:['serenidade','sabedoria','aceitação']},
{id:13,title:'Oração de São Francisco',text:'Senhor, fazei de mim um instrumento da vossa paz. Onde houver ódio, que eu leve o amor. Onde houver ofensa, que eu leve o perdão. Onde houver discórdia, que eu leve a união. Onde houver dúvida, que eu leve a fé. Onde houver erro, que eu leve a verdade. Onde houver desespero, que eu leve a esperança. Onde houver tristeza, que eu leve a alegria. Ó Mestre, fazei que eu procure mais consolar do que ser consolado.',cat:'consagracao',src:'São Francisco de Assis',dif:3,tags:['francisco','paz','amor','serviço']},
{id:14,title:'Oração de Santo Agostinho',text:'Tu nos fizeste para ti, Senhor, e o nosso coração está inquieto enquanto não repousa em ti. Quem me dará que eu venha repousar em ti? Quem me concederá que venhas ao meu coração e o embriagues, para que me esqueça dos meus males e te abrace, meu único bem? O que és tu para mim? Tem piedade para que eu fale. Que sou eu para ti, para que me ordenes que te ame?',cat:'anseio',src:'Confissões — Santo Agostinho',dif:3,tags:['agostinho','busca','repouso']},
{id:15,title:'Bênção Sacerdotal',text:'O Senhor te abençoe e te proteja; o Senhor faça resplandecer o seu rosto sobre ti e te conceda graça; o Senhor volte o seu rosto para ti e te dê paz.',cat:'grandes_oracoes',src:'Números 6:24-26 (NVI)',dif:1,tags:['bênção','paz','guarda','fundamental']},
{id:16,title:'Entrada no Dia — Salmo 5',text:'Dá ouvidos às minhas palavras, Senhor; considera o meu gemido. Presta atenção ao meu pedido de socorro, meu Rei e meu Deus, pois a ti dirijo a minha oração. De manhã, Senhor, tu ouvirás a minha voz; de manhã te apresentarei a minha petição e esperarei por ti. Mas eu, pela tua grande graça, entrarei na tua casa.',cat:'manha',src:'Salmo 5:1-3,7 (NVI)',dif:2,tags:['manhã','clamor','espera']},
{id:17,title:'Oração da Manhã — Dedicação do Dia',text:'Senhor, obrigado por mais um dia de vida. Que eu possa viver este dia para a tua glória. Guia os meus passos, as minhas palavras e os meus pensamentos. Que tua presença me acompanhe em cada momento. Que eu seja instrumento do teu amor em tudo que fizer hoje. Remove de mim o orgulho e enche-me de humildade e amor. Para a glória do teu nome. Amém.',cat:'manha',src:'Oração matinal cristã',dif:1,tags:['manhã','gratidão','guia','vida']},
{id:18,title:'Oração da Noite',text:'Em paz deito e adormeço, porque somente tu, Senhor, me fazes repousar em segurança. Tu me enches de alegria maior do que a dos que têm abundância de grãos e vinho. Guarda-me como a menina dos olhos; esconde-me à sombra das tuas asas. Ao despertar ficarei satisfeito contemplando a tua semelhança.',cat:'noite',src:'Salmo 4:8; 17:8,15 (NVI)',dif:2,tags:['noite','sono','paz','segurança']},
{id:19,title:'Bênção sobre a Família',text:'Senhor, abençoa este lar. Que Cristo seja o fundamento desta casa. Que o amor seja a linguagem desta família. Que o perdão seja praticado quando houver falha. Que a Palavra de Deus seja o pão diário desta mesa. Afasta de nós a discórdia e o espírito amargo. Que as gerações vindouras possam dizer: nesta casa habitou o Senhor. Amém.',cat:'familia',src:'Oração pelo lar cristão',dif:2,tags:['família','lar','amor','bênção']},
{id:20,title:'Oração pelos Filhos',text:'Senhor, tu conheces cada filho que me deste melhor do que eu os conheço. Guia-os pelo teu caminho. Protege-os do mal. Levanta pessoas de caráter que os façam crescer na fé. Que eles te conheçam desde jovens e nunca se afastem de ti. Coloca em seus corações o amor pela tua Palavra. Que sejam como árvores plantadas à beira de rios. Amém.',cat:'familia',src:'Oração pelos filhos',dif:2,tags:['família','filhos','proteção','fé']},
{id:21,title:'Oração pelos Pais',text:'Senhor, abençoa meus pais. Recompensa-os por todo o amor que derramaram sobre mim. Dá-lhes saúde, paz e alegria nos seus dias. Se ainda não te conhecem, que possam encontrar-te. Se já te conhecem, aprofunda sua fé. Honra-os pelo teu amor, pois o teu mandamento promete vida longa a quem os honra. Que em seus últimos dias conheçam a tua paz que excede todo entendimento. Amém.',cat:'familia',src:'Oração pelos pais',dif:2,tags:['família','pais','bênção','saúde']},
{id:22,title:'Oração por Enfermos',text:'Senhor Jesus, tu que percorreste a Galileia curando todos os enfermos, olha com misericórdia para aqueles que estão doentes. Toca-os com a tua mão poderosa. Que a tua cura flua sobre eles. Fortifica os médicos e enfermeiros que os tratam. Dá aos familiares força para suportar. Que nesta provação tu sejas glorificado e que a fé deles não vacile. Amém.',cat:'enfermos',src:'Mateus 4:23; Tiago 5:14 (NVI)',dif:2,tags:['cura','enfermidade','misericórdia']},
{id:23,title:'Pelas Chagas de Jesus — Cura',text:'Senhor, a tua Palavra declara que pelas feridas de Jesus somos curados. Aproximo-me do trono da graça com confiança e reclamo esta promessa sobre este que está enfermo. Que o mesmo poder que ressuscitou Cristo dos mortos opere neste corpo. Que a saúde retorne em nome de Jesus. Que o gozo do Senhor seja a sua força nos dias de prova. Amém.',cat:'enfermos',src:'Isaías 53:5; Romanos 8:11 (NVI)',dif:3,tags:['cura','promessa','poder']},
{id:24,title:'Por um Emprego Digno',text:'Senhor, tu és o provedor de todas as coisas. Coloca diante de mim a oportunidade certa no tempo certo. Que meu trabalho seja reflexo do teu caráter. Abre portas que ninguém possa fechar. Dá-me favor diante das pessoas. Que eu trabalhe com todo o meu coração como se fosse para o Senhor, não para os homens. Que meu trabalho honre teu nome. Amém.',cat:'trabalho',src:'Colossenses 3:23; Apocalipse 3:8 (NVI)',dif:2,tags:['trabalho','emprego','provisão','favor']},
{id:25,title:'Pela Provisão Financeira',text:'Senhor, tu prometeste que o justo nunca ficaria desamparado, nem veria seus filhos mendigando pão. Confio em ti como meu provedor. Que eu seja generoso para dar e que tu possas abrir as janelas dos céus sobre minha vida. Que eu administre bem o que me confiastes. Afasta de mim a ganância e a ansiedade pelo amanhã. Amém.',cat:'trabalho',src:'Salmo 37:25; Malaquias 3:10 (NVI)',dif:3,tags:['finanças','provisão','confiança']},
{id:26,title:'Oração por Sabedoria',text:'Senhor, como Salomão pediu sabedoria acima de todas as riquezas, peço-te hoje que me dês entendimento. Que eu possa discernir o bem do mal, a verdade do erro. Que tua Palavra seja lâmpada para os meus pés e luz para o meu caminho. Se alguém precisa de sabedoria, que a peça a Deus, que a dá generosamente a todos sem fazer censura. Amém.',cat:'sabedoria',src:'1 Reis 3:9; Salmo 119:105; Tiago 1:5 (NVI)',dif:3,tags:['sabedoria','discernimento','espírito']},
{id:27,title:'Antes de Orar em Público',text:'Senhor, eu não venho com eloquência ou sabedoria humana. Venho apenas com o teu nome. Cobre minha boca com tua graça. Que quando eu abrir a boca, tu fales. Tira de mim o temor do ser humano, que é uma armadilha. Que o amor que tens por este povo seja maior que qualquer medo que eu sinta. Usa-me como vaso de barro cheio do teu Espírito. Amém.',cat:'orar_publico',src:'1 Coríntios 2:1-5; Provérbios 29:25 (NVI)',dif:2,tags:['público','coragem','medo','voz']},
{id:28,title:'Coragem para Servir',text:'Senhor, não sou digno de estar diante de ti. Mas tu mesmo me chamaste. Aqui estou. Usa-me como instrumento da tua vontade. Que não seja eu quem fala, mas o teu Espírito em mim. Dá-me coragem quando sentir medo, palavras quando não souber o que falar, e amor quando não tiver forças. Que eles vejam a ti e não a mim. Para a glória do teu nome. Amém.',cat:'orar_publico',src:'Isaías 6:8; Mateus 10:19-20 (NVI)',dif:2,tags:['serviço','espírito','coragem','público']},
{id:29,title:'Louvor — Salmo 100',text:'Aclamai o Senhor, toda a terra. Adorai o Senhor com alegria; vinde à sua presença com cânticos. Saibam que o Senhor é Deus. Foi ele quem nos fez, e somos dele; somos o seu povo, o rebanho do seu pasto. Entrai pelas suas portas com ação de graças; vinde a seus átrios com louvor; dai-lhe graças e louvai o seu nome. Pois o Senhor é bom, e o seu amor dura para sempre; a sua fidelidade é de geração em geração.',cat:'louvor',src:'Salmo 100 (NVI)',dif:2,tags:['louvor','adoração','alegria','misericórdia']},
{id:30,title:'Ação de Graças',text:'Pai celeste, que teu nome seja louvado por todos os teus benefícios. Por cada manhã de vida, por cada refeição à mesa, por cada abraço recebido e por cada provação que me tornou mais forte. Que a gratidão flua de mim como um rio perene. Que eu nunca me esqueça do teu amor. Deem graças em todas as circunstâncias, pois esta é a vontade de Deus para vocês em Cristo Jesus.',cat:'gratidao',src:'1 Tessalonicenses 5:18 (NVI)',dif:2,tags:['gratidão','bênção','louvor']},
{id:31,title:'Oração pela Nação',text:'Senhor Deus, olha para esta nação. Se o teu povo se humilhar, orar, buscar a tua face e se afastar dos seus maus caminhos, então tu ouvirás do céu, perdoarás o pecado deles e restaurarás a sua terra. Levanta governantes que te temam, juízes íntegros e líderes comprometidos com a justiça. Que tua vontade seja feita aqui como no céu. Amém.',cat:'intercecao',src:'2 Crônicas 7:14 (NVI)',dif:3,tags:['nação','intercessão','governo','justiça']},
{id:32,title:'Oração de Arrependimento — Salmo 51',text:'Tem misericórdia de mim, ó Deus, de acordo com o teu amor; de acordo com a tua grande compaixão apaga as minhas transgressões. Lava completamente a minha iniquidade e purifica-me do meu pecado. Cria em mim um coração puro, ó Deus, e renova em mim um espírito firme. Não me afastes da tua presença nem retires de mim o teu Espírito Santo.',cat:'penitencia',src:'Salmo 51:1-2,10-11 (NVI)',dif:3,tags:['perdão','arrependimento','purificação']},
{id:33,title:'Confiança nas Provações — Habacuque',text:'Mesmo que a figueira não floresça, nem haja uvas na videira; mesmo que a oliveira não produza e os campos não deem colheita; mesmo que o rebanho desapareça do aprisco e não haja gado nos currais, ainda assim eu me alegrarei no Senhor e me regozijarei no Deus da minha salvação.',cat:'forca',src:'Habacuque 3:17-18 (NVI)',dif:4,tags:['fé','adversidade','alegria','confiança']},
{id:34,title:'A Armadura de Deus',text:'Senhor, coloco hoje toda a armadura de Deus. Cingo a minha cintura com a verdade, visto a couraça da justiça, calço os pés com a prontidão que vem do evangelho da paz. Levanto o escudo da fé, com o qual posso apagar todas as flechas em chamas do Maligno. Tomo também o capacete da salvação e a espada do Espírito, que é a palavra de Deus. Amém.',cat:'protecao',src:'Efésios 6:14-17 (NVI)',dif:3,tags:['proteção','armadura','espiritual']},
{id:35,title:'Busca de Deus — Salmo 42',text:'Como o cervo que anseia por correntes de água, assim a minha alma anseia por ti, ó Deus. A minha alma tem sede de Deus, do Deus vivo. Quando poderei comparecer e ver a face de Deus? Por que estás tão abatida, alma minha? Por que gemes dentro de mim? Põe a tua esperança em Deus, pois ainda o louvarei, o meu Salvador e meu Deus.',cat:'anseio',src:'Salmo 42:1-2,5 (NVI)',dif:3,tags:['sede','anseio','esperança','alma']},
{id:36,title:'Entrega Total',text:'Portanto, apelo a vocês pelas misericórdias de Deus que ofereçam os seus corpos como sacrifício vivo, santo e agradável a Deus — este é o culto racional de vocês. Não se amoldem ao padrão deste mundo, mas transformem-se pela renovação da sua mente, para que sejam capazes de experimentar e comprovar a boa, agradável e perfeita vontade de Deus. Aqui estou, Senhor, todo rendido a ti.',cat:'consagracao',src:'Romanos 12:1-2 (NVI)',dif:3,tags:['consagração','rendição','transformação']},
{id:37,title:'Louvai ao Senhor — Salmo 150',text:'Louvai o Senhor. Louvai a Deus no seu santuário; louvai-o em seu poderoso firmamento. Louvai-o pelos seus atos poderosos; louvai-o conforme a sua excelente grandeza. Louvai-o ao som da trombeta; louvai-o com harpa e lira. Louvai-o com tamboril e dança; louvai-o com instrumentos de corda e flauta. Todo ser que respira louve o Senhor. Louvai o Senhor!',cat:'louvor',src:'Salmo 150 (NVI)',dif:2,tags:['louvor','adoração','música','alegria']},
{id:38,title:'Oração de Rendição',text:'Senhor Jesus, venho diante de ti com mãos abertas e coração humilde. Não tenho nada a oferecer além de mim mesmo. Toma a minha vida, toma os meus planos, toma os meus medos. Eu confio em ti. Não seja como eu quero, mas como tu queres. Guia-me onde quiseres, usa-me como entenderes, porque tu és o Senhor da minha vida.',cat:'consagracao',src:'Mateus 26:39; Romanos 12:1 (NVI)',dif:2,tags:['rendição','confiança','humildade']},
{id:39,title:'Renovação da Mente',text:'Senhor, transforma a minha mente pelo poder do teu Espírito Santo. Arranca pensamentos de dúvida, de medo e de derrota. Planta em mim pensamentos de fé, de esperança e de vitória. Não me amoldes ao padrão deste mundo, mas transforma-me pela renovação da minha mente. Que eu pense no que é verdadeiro, honesto, justo, puro, amável e de boa fama. Amém.',cat:'consagracao',src:'Romanos 12:2; Filipenses 4:8 (NVI)',dif:2,tags:['mente','renovação','pensamentos']},
{id:40,title:'Intercessão pelo Próximo',text:'Senhor, venho interceder por aqueles que colocaste em meu coração. Sou apenas um mensageiro entre eles e ti. Pela autoridade que me deste em Cristo Jesus, declaro que o teu reino vem para cada vida. Que o teu Espírito os convença, que o teu amor os cure, e que a tua graça os salve. Em nome de Jesus. Amém.',cat:'intercecao',src:'1 Timóteo 2:1; João 16:23 (NVI)',dif:3,tags:['intercessão','reino','espírito']},
{id:41,title:'Oração de Hannah',text:'O meu coração exulta no Senhor; no Senhor minha força é exaltada. Minha boca se abre amplamente contra meus inimigos, pois me alegro com a tua salvação. Não há ninguém santo como o Senhor; não há nenhum outro além de ti; não há nenhuma rocha como o nosso Deus. O Senhor faz morrer e faz viver; faz descer ao sepulcro e daí levanta. O Senhor empobrece e enriquece; humilha uns e exalta outros.',cat:'grandes_oracoes',src:'1 Samuel 2:1-7 (NVI)',dif:4,tags:['hannah','louvor','poder']},
{id:42,title:'Viver é Cristo',text:'Senhor, que para mim o viver seja Cristo e o morrer seja lucro. Que eu seja conformado à imagem do teu Filho. Que não seja mais eu quem vive, mas Cristo que vive em mim. E a vida que agora vivo no corpo, vivo-a pela fé no Filho de Deus, que me amou e se entregou por mim.',cat:'consagracao',src:'Filipenses 1:21; Gálatas 2:20 (NVI)',dif:3,tags:['cristo','vida','rendição']},
{id:43,title:'Paz que Excede o Entendimento',text:'Senhor, tu és o Príncipe da Paz. Fala a esta tempestade interior e dize: aquieta-te, sossega. Que a tua paz, que excede todo o entendimento, guarde o meu coração e as minhas mentes em Cristo Jesus. Que eu possa repousar em ti como o discípulo que se recostou no peito de Jesus. Tu és minha paz. Amém.',cat:'paz',src:'Filipenses 4:7; Marcos 4:39; João 13:23 (NVI)',dif:2,tags:['paz','descanso','tempestade']},
{id:44,title:'Iluminação Espiritual — Efésios 1',text:'Pai de glória, peço que o Deus do nosso Senhor Jesus Cristo vos dê espírito de sabedoria e de revelação no pleno conhecimento dele. Peço que os olhos do coração de vocês sejam iluminados para que possam saber qual é a esperança do seu chamado, qual é a riqueza da glória da sua herança nos santos.',cat:'sabedoria',src:'Efésios 1:17-18 (NVI)',dif:4,tags:['sabedoria','revelação','conhecimento']},
{id:45,title:'Oração pela Colheita Espiritual',text:'Senhor da messe, a colheita é grande, mas os trabalhadores são poucos. Peçam, portanto, ao Senhor da colheita que envie trabalhadores para a sua colheita. Que aqueles que ouviram a tua voz sejam enviados. Que a tua Igreja cresça com vigor e que o teu nome seja glorificado entre todas as nações. Amém.',cat:'intercecao',src:'Mateus 9:37-38 (NVI)',dif:3,tags:['missões','evangelismo','colheita']},
{id:46,title:'Declaração de Fé',text:'Senhor, creio que és o Deus que criou os céus e a terra. Creio que enviaste teu Filho Jesus para morrer pelos meus pecados e ressuscitar para a minha justificação. Creio que o teu Espírito habita em mim. Creio em todas as tuas promessas. Pelo contrário, em tudo somos mais que vencedores por meio daquele que nos amou.',cat:'forca',src:'João 3:16; Romanos 8:37 (NVI)',dif:2,tags:['fé','declaração','vitória']},
{id:47,title:'Unidade da Igreja',text:'Pai Santo, que todos sejam um, como tu és em mim e eu em ti, que eles também sejam um em nós. Para que o mundo creia que tu me enviaste. A glória que me deste, dei-a a eles, para que sejam um como nós somos um. Eu neles e tu em mim, para que sejam aperfeiçoados em unidade.',cat:'intercecao',src:'João 17:21-23 (NVI)',dif:3,tags:['unidade','igreja','testemunho']},
{id:48,title:'Amor ao Próximo',text:'Senhor Jesus, tu que disseste que o maior mandamento é amar a Deus e ao próximo, enche-me deste amor que vai além das palavras. Que eu ame com ações e em verdade. Que eu veja nos outros a tua imagem. Filhinhos, não amemos em palavras nem com a língua, mas em ação e em verdade. Faz de mim o bom samaritano. Amém.',cat:'consagracao',src:'Mateus 22:37-39; 1 João 3:18 (NVI)',dif:2,tags:['amor','serviço','próximo']},
{id:49,title:'Oração de Elias no Monte Carmelo',text:'Senhor, Deus de Abraão, de Isaque e de Israel, que seja hoje manifesto que tu és Deus em Israel e que sou teu servo, e que fiz tudo isso por tua ordem. Responde-me, Senhor, responde-me, para que este povo saiba que tu, Senhor, és o único Deus, e que estás convertendo o coração deles.',cat:'grandes_oracoes',src:'1 Reis 18:36-37 (NVI)',dif:4,tags:['elias','poder','nação']},
{id:50,title:'Vem, Espírito Santo',text:'Vem, Espírito Santo, enche este coração. Que a tua presença seja sentida aqui e agora. Que o teu fogo purifique e o teu amor transforme. Que onde houver cinzas, tu tragas beleza. Onde houver luto, manto de louvor. Onde houver espírito angustiado, alegria celestial. Vem, Espírito da graça. Amém.',cat:'anseio',src:'Isaías 61:3; João 14:16 (NVI)',dif:2,tags:['espírito','fogo','presença']},
{id:51,title:'Salmo 103 — Bênçãos do Senhor',text:'Bendize o Senhor, ó minha alma; bendize o seu santo nome, tudo o que há em mim. Bendize o Senhor, ó minha alma, e não te esqueças de nenhum dos seus benefícios. Ele é quem perdoa todas as suas iniquidades, quem sana todas as suas doenças, quem resgata da cova a sua vida, quem o coroa de graça e de compaixão.',cat:'louvor',src:'Salmo 103:1-4 (NVI)',dif:3,tags:['louvor','bênção','perdão','cura']},
{id:52,title:'Oração para Superar o Medo de Orar',text:'Senhor, no amor não existe medo; o amor perfeito expulsa o medo. Eu rejeito o espírito de covardia e recebo o espírito de poder, de amor e de equilíbrio. Quando abrir a boca para orar, que as palavras venham de ti. Que eu lembre que oro para um Pai que me ama e não para uma plateia que me julga. Aproximemo-nos com confiança do trono da graça. Amém.',cat:'orar_publico',src:'1 João 4:18; 2 Timóteo 1:7; Hebreus 4:16 (NVI)',dif:2,tags:['medo','timidez','público','ousadia']},
// ── SALMOS ADICIONAIS ──────────────────────────────
{id:53,title:'Feliz o Homem — Salmo 1',text:'Feliz o homem que não segue o conselho dos ímpios, não se detém no caminho dos pecadores, nem se assenta na roda dos zombadores. Antes, o seu prazer está na lei do Senhor, e nessa lei medita de dia e de noite. É como uma árvore plantada à beira de rios, que produz fruto na estação própria e cujas folhas não murcham. Em tudo o que faz, prospera.',cat:'sabedoria',src:'Salmo 1:1-3 (NVI)',dif:2,tags:['salmo','bênção','meditação','prosperidade']},
{id:54,title:'Quão Magnífico é o Teu Nome — Salmo 8',text:'Senhor, Senhor nosso, quão magnífico é o teu nome em toda a terra! Tu puseste a tua glória acima dos céus. Quando vejo os teus céus, obra dos teus dedos, a lua e as estrelas que ali puseste, quem é o ser humano para que te lembres dele? E o filho do homem para que te preocupes com ele? Contudo, fizeste-o um pouco menor do que os seres celestiais e o coroaste de glória e honra.',cat:'louvor',src:'Salmo 8:1,3-5 (NVI)',dif:2,tags:['salmo','criação','glória','humildade']},
{id:55,title:'Guarda-me, ó Deus — Salmo 16',text:'Guarda-me, ó Deus, pois em ti busco refúgio. Digo ao Senhor: Tu és o meu Senhor. O Senhor é a parte que me coube e o meu cálice; tu sustentas a minha sorte. As fronteiras me foram traçadas em lugares agradáveis; sim, tenho uma herança esplêndida. Bendirei o Senhor, que me aconselha. Tendo sempre o Senhor diante de mim, não serei abalado, pois ele está à minha direita.',cat:'confianca',src:'Salmo 16:1-2,5-6,8 (NVI)',dif:3,tags:['salmo','refúgio','herança','confiança']},
{id:56,title:'Os Céus Proclamam — Salmo 19',text:'Os céus declaram a glória de Deus; o firmamento proclama as obras das suas mãos. Dia após dia profere palavra; noite após noite revela conhecimento. Sejam agradáveis as palavras da minha boca e o meditar do meu coração diante de ti, Senhor, minha rocha e meu Redentor.',cat:'louvor',src:'Salmo 19:1-2,14 (NVI)',dif:2,tags:['salmo','criação','glória','meditação']},
{id:57,title:'A Ti, Senhor, Elevo a Minha Alma — Salmo 25',text:'A ti, Senhor, elevo a minha alma. Meu Deus, em ti confio. Mostra-me, Senhor, os teus caminhos; ensina-me as tuas veredas. Guia-me na tua verdade e ensina-me, pois tu és o Deus que me salva, e em ti espero o dia todo. Lembra-te, Senhor, da tua compaixão e do teu amor, que são eternos.',cat:'sabedoria',src:'Salmo 25:1-2,4-6 (NVI)',dif:2,tags:['salmo','guia','confiança','misericórdia']},
{id:58,title:'Bendirei o Senhor em Todos os Momentos — Salmo 34',text:'Bendirei o Senhor em todos os momentos; o louvor a ele estará sempre nos meus lábios. A minha alma faz sua glória no Senhor; os aflitos ouçam e se alegrem. Engrandeçam o Senhor comigo; exaltemos juntos o seu nome. Busquei o Senhor e ele me respondeu, e livrou-me de todos os meus temores. Os que olham para ele ficam radiantes; jamais os seus rostos serão cobertos de vergonha.',cat:'louvor',src:'Salmo 34:1-5 (NVI)',dif:2,tags:['salmo','louvor','alegria','resposta']},
{id:59,title:'A Minha Alma Descansa em Deus — Salmo 62',text:'A minha alma descansa somente em Deus; a minha salvação vem dele. Somente ele é a minha rocha e a minha salvação; é a minha fortaleza; não serei grandemente abalado. Confie nele em todos os momentos, ó povo; derramai perante ele o vosso coração; Deus é o nosso refúgio.',cat:'paz',src:'Salmo 62:1-2,8 (NVI)',dif:2,tags:['salmo','descanso','refúgio','confiança']},
{id:60,title:'Sede de Deus — Salmo 63',text:'Ó Deus, tu és o meu Deus, e ardentemente te busco; a minha alma tem sede de ti, o meu corpo te anseia, como terra seca e árida, sem água. Vi-te no santuário, contemplando o teu poder e a tua glória. Como o teu amor é melhor do que a vida, os meus lábios te louvarão.',cat:'anseio',src:'Salmo 63:1-3 (NVI)',dif:2,tags:['salmo','sede','busca','louvor']},
{id:61,title:'Como São Amáveis as Tuas Moradas — Salmo 84',text:'Como são amáveis as tuas moradas, Senhor dos Exércitos! Suspira, e até desfalece, a minha alma pelos átrios do Senhor; o meu coração e a minha carne clamam ao Deus vivo. Melhor é um dia nos teus átrios do que mil em outro lugar. Prefiro ficar na soleira da casa do meu Deus a habitar nas tendas dos ímpios.',cat:'anseio',src:'Salmo 84:1-2,10 (NVI)',dif:3,tags:['salmo','moradas','presença','desejo']},
{id:62,title:'Tu Tens Sido o Nosso Lar — Salmo 90',text:'Senhor, tu tens sido o nosso lar de geração em geração. Antes que os montes fossem criados, ou que existissem a terra e o mundo, de eternidade a eternidade, tu és Deus. Ensina-nos a contar os nossos dias, para que o nosso coração alcance sabedoria. Sacia-nos pela manhã com o teu amor, para que cantemos de alegria todos os dias da nossa vida.',cat:'sabedoria',src:'Salmo 90:1-2,12,14 (NVI)',dif:3,tags:['salmo','eternidade','sabedoria','benignidade']},
{id:63,title:'Elevo os Meus Olhos para os Montes — Salmo 121',text:'Elevo os meus olhos para os montes — de onde virá o meu socorro? O meu socorro vem do Senhor, criador do céu e da terra. Não permitirá que os seus pés vacilam; o que te guarda não dormitará. O Senhor é o teu guia; o Senhor é a tua sombra à tua mão direita. O Senhor guardará a tua saída e a tua entrada, desde agora e para sempre.',cat:'protecao',src:'Salmo 121 (NVI)',dif:2,tags:['salmo','guarda','socorro','proteção']},
{id:64,title:'Dos Abismos Clamo — Salmo 130',text:'Dos abismos clamo a ti, Senhor. Senhor, ouve a minha voz! Que os teus ouvidos sejam atentos à voz das minhas súplicas. Se tu levares em conta as iniquidades, Senhor, quem subsistirá? Mas em ti há perdão; por isso és temido. Espero no Senhor, a minha alma espera, e na sua palavra está a minha esperança.',cat:'penitencia',src:'Salmo 130:1-4 (NVI)',dif:3,tags:['salmo','profundeza','perdão','esperança']},
{id:65,title:'Tu Me Sondas e Me Conheces — Salmo 139',text:'Senhor, tu me sondas e me conheces. Sabes quando me sento e quando me levanto; de longe percebes o meu pensamento. Observas o meu caminhar e o meu deitar; estás familiarizado com todos os meus caminhos. Eu te louvo porque sou feito de modo assombroso e maravilhoso; as tuas obras são maravilhosas, disso estou bem ciente. Examina-me, ó Deus, e conhece o meu coração.',cat:'consagracao',src:'Salmo 139:1-2,4,14,23 (NVI)',dif:3,tags:['salmo','conhecimento','criação','coração']},
{id:66,title:'Senhor, Ouve a Minha Oração — Salmo 143',text:'Senhor, ouve a minha oração; dá ouvidos à minha súplica. Por causa da tua fidelidade e da tua justiça, responde-me. A minha alma tem sede de ti como terra seca e árida. Faze-me ouvir de manhã o teu amor, porque em ti depositei a minha confiança. Revela-me o caminho que devo seguir, porque elevo a minha alma a ti.',cat:'manha',src:'Salmo 143:1,6-8 (NVI)',dif:3,tags:['salmo','súplica','anseio','guia']},
{id:67,title:'Cantai ao Senhor um Cântico Novo — Salmo 96',text:'Cantai ao Senhor um cântico novo; cantai ao Senhor, toda a terra. Cantai ao Senhor, louvai o seu nome; proclamai a sua salvação dia após dia. Declarai a sua glória entre as nações, as suas maravilhas entre todos os povos. Pois o Senhor é grande e digno de todo o louvor; temível ele é, acima de todos os deuses.',cat:'louvor',src:'Salmo 96:1-4 (NVI)',dif:2,tags:['salmo','cântico','glória','nações']},
{id:68,title:'Esperando Esperiei pelo Senhor — Salmo 40',text:'Esperando, esperiei pelo Senhor, e ele se inclinou para mim e ouviu o meu clamor. Ele me tirou de um poço de perdição, de um charco de lama; colocou os meus pés sobre uma rocha e firmou os meus passos. Pôs nos meus lábios um cântico novo, um hino de louvor ao nosso Deus. Muitos verão e temerão e depositarão a sua confiança no Senhor.',cat:'forca',src:'Salmo 40:1-3 (NVI)',dif:3,tags:['salmo','espera','libertação','cântico']},
{id:69,title:'Nas Tuas Mãos Entrego — Salmo 31',text:'Em ti, Senhor, busco refúgio; nunca me deixes ser envergonhado; livra-me pela tua justiça. Inclina para mim o teu ouvido; vem depressa em meu socorro; sê para mim uma rocha de refúgio, uma fortaleza de defesa para me salvar. Pois tu és a minha rocha e a minha fortaleza. Nas tuas mãos entrego o meu espírito; tu me redimes, Senhor, Deus fiel.',cat:'protecao',src:'Salmo 31:1-3,5 (NVI)',dif:3,tags:['salmo','refúgio','entrega','confiança']},
{id:70,title:'Não te Irrites — Salmo 37',text:'Não te irrites por causa dos malfeitores; não tenhas inveja dos que praticam o mal. Confie no Senhor e pratique o bem; habite na terra e cultive a fidelidade. Deleite-se no Senhor, e ele lhe concederá os desejos do seu coração. Descanse no Senhor e espere nele pacientemente.',cat:'paz',src:'Salmo 37:1,3-4,7 (NVI)',dif:2,tags:['salmo','descanso','confiança','desejos']},
// ── ORAÇÕES DO NOVO TESTAMENTO ─────────────────────
{id:71,title:'Oração dos Discípulos — Atos 4',text:'Senhor Soberano, tu fizeste o céu e a terra, o mar e tudo o que neles existe. Agora, Senhor, considera as ameaças que nos fazem, e capacita os teus servos a proclamar a tua palavra com toda ousadia. Estende tua mão para curar, e faze que sinais e maravilhas sejam realizados por meio do nome do teu santo servo Jesus.',cat:'orar_publico',src:'Atos 4:24,29-30 (NVI)',dif:3,tags:['ousadia','sinais','maravilhas','palavra']},
{id:72,title:'Oração de Estêvão — O Primeiro Mártir',text:'Enquanto apedrejavam Estêvão, este orava: Senhor Jesus, recebe o meu espírito. Depois, ajoelhou-se e clamou em alta voz: Senhor, não lhes imputes este pecado. Senhor, que mesmo neste momento difícil eu possa perdoar como tu perdoaste. Que minha vida e minha morte glorifiquem o teu nome.',cat:'grandes_oracoes',src:'Atos 7:59-60 (NVI)',dif:3,tags:['estêvão','perdão','espírito','martírio']},
{id:73,title:'Benedictus — Cântico de Zacarias',text:'Louvado seja o Senhor, o Deus de Israel, porque interveio e redimiu o seu povo. Levantou um poderoso Salvador para nós da família de seu servo Davi, para nos capacitar a servi-lo sem medo, em santidade e justiça, em sua presença, todos os nossos dias. E você, criança, será chamado profeta do Altíssimo, pois irá adiante do Senhor para preparar os seus caminhos.',cat:'grandes_oracoes',src:'Lucas 1:68-69,75-76 (NVI)',dif:3,tags:['zacarias','redenção','salvação','santidade']},
{id:74,title:'Paulo pelos Colossenses',text:'Por isso, desde o dia em que ouvimos a respeito de vocês, não cessamos de orar por vocês, pedindo que sejam cheios do conhecimento da vontade de Deus com toda a sabedoria e entendimento espiritual, para que vivam de maneira digna do Senhor, agradando-o em tudo, dando fruto em toda boa obra, crescendo no conhecimento de Deus.',cat:'sabedoria',src:'Colossenses 1:9-10 (NVI)',dif:3,tags:['paulo','sabedoria','frutificar','crescer']},
{id:75,title:'Paulo pelos Tessalonicenses',text:'Que o Senhor os faça crescer e transbordar de amor uns pelos outros e por todos. Que o seu coração seja fortalecido para que sejam santos e irrepreensíveis diante do nosso Deus e Pai quando nosso Senhor Jesus vier com todos os seus santos.',cat:'familia',src:'1 Tessalonicenses 3:12-13 (NVI)',dif:3,tags:['paulo','amor','santidade','crescer']},
{id:76,title:'O Filho Pródigo Retorna',text:'Vou me levantar, ir ao meu pai e dizer-lhe: Pai, pequei contra o céu e contra ti. Não mereço mais ser chamado teu filho; trate-me como um dos teus empregados. Mas o pai disse aos seus servos: Tragam logo a melhor roupa e a vistam nele; ponham um anel em seu dedo e sandálias em seus pés. Esse meu filho estava morto e voltou à vida; estava perdido e foi achado.',cat:'penitencia',src:'Lucas 15:18-19,22-24 (NVI)',dif:2,tags:['perdão','filho','restauração','graça']},
{id:77,title:'O Ladrão na Cruz',text:'Jesus, lembra-te de mim quando entrares no teu reino. Jesus respondeu: Eu lhe asseguro que hoje mesmo você estará comigo no paraíso. Senhor, também eu sou pecador. Não há nada em mim que mereça a tua graça. Mas confio que tua misericórdia é maior que meu pecado. Lembra-te de mim.',cat:'penitencia',src:'Lucas 23:42-43 (NVI)',dif:1,tags:['graça','perdão','paraíso','misericórdia']},
{id:78,title:'Paulo — Deus da Esperança',text:'Que o Deus da perseverança e do encorajamento lhes dê o mesmo modo de pensar uns para com os outros, segundo Cristo Jesus, para que, unidos de mente e de voz, glorifiquem o Deus e Pai do nosso Senhor Jesus Cristo. Que o Deus da esperança os encha de toda alegria e paz por crerdes nele, para que transbordem de esperança pelo poder do Espírito Santo.',cat:'paz',src:'Romanos 15:5-6,13 (NVI)',dif:3,tags:['esperança','paz','gozo','espírito']},
{id:79,title:'Bênção Trinitária — Paulo',text:'A graça do Senhor Jesus Cristo, o amor de Deus e a comunhão do Espírito Santo sejam com todos vocês. Que eu receba cada dia esta graça trinitária. Que o amor do Pai, a graça do Filho e a comunhão do Espírito me cubram do amanhecer ao anoitecer. Amém.',cat:'gratidao',src:'2 Coríntios 13:14 (NVI)',dif:1,tags:['graça','trindade','bênção','amor']},
// ── GRANDES CRISTÃOS ───────────────────────────────
{id:80,title:'Calvino — Início do Dia',text:'Senhor Deus, Pai eterno e todo-poderoso, confessamos e reconhecemos de coração que somos indignos de levantar os nossos olhos para o céu para te chamar. Mas como te agradaste de nos mandar invocar o teu santo nome e prometeste ouvir as nossas orações, concedei-nos hoje a graça de cumprir o nosso dever.',cat:'manha',src:'João Calvino',dif:3,tags:['calvino','manhã','indignidade','graça']},
{id:81,title:'Lutero — Antes do Trabalho',text:'Senhor Deus, obrigado pela noite de descanso e pelo novo dia. Guia e governa os meus pensamentos e minhas ações para que tudo o que eu faça seja conforme tua vontade. Livra-me de tudo que me afaste de ti. Que eu te sirva com alegria hoje. Amém.',cat:'trabalho',src:'Martinho Lutero',dif:2,tags:['lutero','manhã','trabalho','guia']},
{id:82,title:'Wesley — Consagração Total',text:'Eu não sou mais meu. Sou teu. Coloca-me onde quiseres. Coloca-me com quem quiseres. Faze de mim o que quiseres. Emprega-me no que quiseres. Permite que seja cheio ou esvaziado, que eu tenha tudo ou nada. Livremente e de todo o coração eu cedo tudo à tua vontade e ao teu agrado.',cat:'consagracao',src:'John Wesley',dif:3,tags:['wesley','consagração','rendição','vontade']},
{id:83,title:'Spurgeon — Por Mais Fé',text:'Senhor, dá-me mais fé. Quando sinto que a fé vacila, ajuda-me a lembrar de tua fidelidade. Quando me sinto fraco, faz-me forte na tua graça. Quando estou tentado a duvidar, lembra-me de todas as vezes que provaste ser fiel. Que minha confiança seja em ti e não em mim mesmo. Amém.',cat:'forca',src:'Charles Spurgeon',dif:2,tags:['spurgeon','fé','graça','força']},
{id:84,title:'Thomas à Kempis — Conhecer o Bem',text:'Dai-me, Senhor, conhecer o que deve ser conhecido, amar o que deve ser amado, louvar o que vos agrada sobremaneira, estimar o que vos é precioso, abominar o que é imundo aos vossos olhos. Não me deixeis julgar segundo o que apareça exteriormente, mas que eu possa discernir as coisas espirituais.',cat:'sabedoria',src:'Thomas à Kempis — Imitação de Cristo',dif:3,tags:['kempis','discernimento','espiritual','amor']},
{id:85,title:'Teresa de Ávila — Nada te Perturbe',text:'Nada te perturbe. Nada te espante. Tudo passa. Deus não muda. A paciência tudo alcança. Quem a Deus tem, nada lhe falta. Só Deus basta. Senhor, ajuda-me a descansar nesta verdade quando tudo ao redor estiver em caos. Tu és minha âncora e meu porto seguro.',cat:'paz',src:'Teresa de Ávila',dif:1,tags:['teresa','paz','paciência','Deus basta']},
{id:86,title:'Bonhoeffer — Na Tribulação',text:'Senhor, seja o que for que este dia traz, tua presença é a minha força. Quando não entendo teus caminhos, que eu confie em teu caráter. Quando os tempos são sombrios, que eu lembre que tu és a luz do mundo. Que minha fé não dependa das circunstâncias, mas do Deus que está acima de todas elas.',cat:'forca',src:'Dietrich Bonhoeffer',dif:3,tags:['bonhoeffer','confiança','tribulação','presença']},
{id:87,title:'Thomas Merton — Caminho Desconhecido',text:'Meu Senhor Deus, não sei para onde estou indo. Não vejo a estrada à minha frente. Não posso saber com certeza onde ela levará. Mas creio que o desejo de te agradar te agrada de fato. E espero ter esse desejo em tudo que faço. Espero nunca fazer nada separado desse desejo.',cat:'consagracao',src:'Thomas Merton',dif:3,tags:['merton','confiança','desejo','caminho']},
{id:88,title:'Finney — Por Avivamento',text:'Ó Senhor, manda um avivamento e que ele comece em mim. Cria em mim um coração puro. Renova um espírito firme dentro de mim. Que o fogo do teu amor queime tudo que não é teu. Que eu seja quebrantado, curado e cheio do teu Espírito. Que a tua glória cubra esta terra como as águas cobrem o mar.',cat:'anseio',src:'Charles Finney',dif:3,tags:['avivamento','quebrantamento','espírito','glória']},
{id:89,title:'Moody — Por Almas Perdidas',text:'Senhor, transforma-me em alguém que não vive para si mesmo. Que eu tenha tanta compaixão pelas almas perdidas quanto tu tens. Que eu nunca passe por alguém sem pensar em sua eternidade. Usa-me para alcançar os que estão longe de ti. Que nenhum dia passe sem que eu leve alguém para mais perto de ti.',cat:'evangelismo',src:'D.L. Moody',dif:2,tags:['moody','almas','compaixão','evangelismo']},
{id:90,title:'Hudson Taylor — Missão',text:'Senhor, eu tenho apenas uma vida para viver. Que ela seja vivida para ti. Que cada decisão que tomo seja filtrada pela eternidade. O que importará daqui a cem anos? Isso é o que quero fazer hoje. Usa-me no campo que plantaste para mim.',cat:'consagracao',src:'Hudson Taylor',dif:2,tags:['missão','eternidade','vida','decisão']},
// ── ORAÇÕES POR SITUAÇÕES ESPECÍFICAS ────────────────
{id:91,title:'Antes de uma Decisão Importante',text:'Senhor, estou diante de uma escolha que pode mudar o curso da minha vida. Confio em ti de todo o coração e não me apoio no meu próprio entendimento; em todos os meus caminhos te reconheço. Quer eu me desvie para a direita ou para a esquerda, que meus ouvidos ouçam uma voz que diz: este é o caminho, andem por aqui.',cat:'sabedoria',src:'Provérbios 3:5-6; Isaías 30:21 (NVI)',dif:2,tags:['decisão','guia','confiança','direção']},
{id:92,title:'No Tempo de Luto',text:'Senhor, estou com o coração partido. A dor parece maior do que posso suportar. Mas o Senhor está perto dos que têm o coração quebrantado e salva os de espírito abatido. Chora tu comigo, como choraste diante do túmulo de Lázaro. E quando for o tempo, tira-me desta sepultura para nova vida.',cat:'forca',src:'Salmo 34:18; João 11:35 (NVI)',dif:2,tags:['luto','dor','consolo','quebrantamento']},
{id:93,title:'Pela Cura da Depressão',text:'Senhor, minha alma está abatida. Não consigo ver a saída. Mas lembro que Elias também pediu para morrer debaixo de uma árvore e tu não o abandonaste — enviaste um anjo com pão. A jornada que está diante de ti é longa demais. Alimenta-me hoje, Senhor. Levanta-me desta depressão.',cat:'enfermos',src:'Salmo 42:5; 1 Reis 19:4-8 (NVI)',dif:2,tags:['depressão','cura','esperança','consolo']},
{id:94,title:'Por um Filho Afastado da Fé',text:'Senhor, como o pai do filho pródigo, fico à janela esperando o retorno deste filho que se afastou. Meu amor por ele não muda. Alcança-o onde está. Que um dia ele se levante e venha a ti. Que eu seja capaz de recebê-lo com os braços abertos, como tu me recebeste quando eu estava perdido.',cat:'familia',src:'Lucas 15:20; Romanos 5:8 (NVI)',dif:3,tags:['filho','restauração','retorno','amor']},
{id:95,title:'Antes de uma Cirurgia',text:'Senhor, coloco esta vida nas tuas mãos. Tu me formaste no ventre da minha mãe; sou feito de modo assombroso e maravilhoso. Guia as mãos dos médicos. Que a tua paz, que excede todo o entendimento, guarde meu coração agora. Seja qual for o resultado, que eu possa dizer: o Senhor deu, o Senhor tirou, bendito seja o nome do Senhor.',cat:'enfermos',src:'Salmo 139:13-14; Filipenses 4:7; Jó 1:21 (NVI)',dif:2,tags:['cirurgia','medicina','paz','confiança']},
{id:96,title:'Por um Casamento em Crise',text:'Senhor, não foi assim que imaginamos. Mas ainda estamos aqui e ainda temos a aliança que fizemos. Restaura o que o inimigo veio roubar. Cura as feridas que nos demos. Que o amor que um dia sentimos seja renovado. O que Deus uniu, que o ser humano não separe.',cat:'familia',src:'Mateus 19:6 (NVI)',dif:3,tags:['casamento','restauração','cura','aliança']},
{id:97,title:'Pela Reconciliação',text:'Senhor, há uma parede entre mim e esta pessoa. Será que sou também culpado nesta situação? Dá-me humildade para reconhecer minha parte. Remove de mim o orgulho que me impede de pedir perdão. Que eu seja o primeiro a estender a mão. Que a paz de Cristo governe este relacionamento.',cat:'penitencia',src:'Mateus 5:23-24; Colossenses 3:15 (NVI)',dif:2,tags:['reconciliação','perdão','humildade','paz']},
{id:98,title:'Antes de Estudar ou Trabalhar',text:'Senhor, dedico este tempo ao teu nome. Ilumina minha mente, aguça minha memória, dá-me concentração e entendimento. Que o conhecimento que adquirir seja usado para teu reino. Que eu trabalhe com todo o meu coração como se fosse para o Senhor, não para os homens. Amém.',cat:'trabalho',src:'Colossenses 3:23 (NVI)',dif:1,tags:['estudo','foco','mente','trabalho']},
{id:99,title:'No Trânsito',text:'Senhor, neste momento de deslocamento, que teu Espírito me acompanhe. Dá paciência quando houver demora. Dá atenção quando houver perigo. Que eu chegue em segurança ao destino. E que eu use este tempo para orar, louvar ou simplesmente descansar em tua presença.',cat:'manha',src:'Salmo 121:8 (NVI)',dif:1,tags:['viagem','proteção','paciência','cotidiano']},
{id:100,title:'Depois de um Pecado ou Erro',text:'Pai, caí de novo. Envergonho-me de estar aqui outra vez. Mas sei que, se confessarmos os nossos pecados, ele é fiel e justo para perdoar os nossos pecados e nos purificar de toda injustiça. Recebo esse perdão agora. Levanto-me da poeira. As misericórdias do Senhor são novas a cada manhã.',cat:'penitencia',src:'1 João 1:9; Lamentações 3:22-23 (NVI)',dif:1,tags:['pecado','perdão','graça','recomeço']},
{id:101,title:'Pela Memória e Entendimento',text:'Senhor, que gravaste tua lei no coração do teu povo, grava também em mim as tuas palavras. Que não saiam da minha boca; que eu medite nelas de dia e de noite para que observe tudo quanto nelas está escrito. Afia minha mente para guardar e praticar tua Palavra.',cat:'sabedoria',src:'Josué 1:8; Jeremias 31:33 (NVI)',dif:2,tags:['memória','palavra','meditação','entendimento']},
{id:102,title:'Por Líderes da Igreja',text:'Senhor, abençoa nosso pastor. Sustenta-o física, emocional e espiritualmente. Dá-lhe sabedoria para pregar, coragem para confrontar o pecado e amor para consolar o ferido. Protege-o das armadilhas do orgulho, da imoralidade e do esgotamento. Que ele seja um pastor segundo o teu coração.',cat:'intercecao',src:'Jeremias 3:15; 1 Pedro 5:2-3 (NVI)',dif:2,tags:['pastor','liderança','proteção','sabedoria']},
{id:103,title:'Pela Igreja Perseguida',text:'Senhor, lembra-se dos presos como se você mesmo fosse prisioneiro, e dos que são maltratados como se você mesmo estivesse sofrendo. Fortifica-os com poder pelo teu Espírito. Que o sangue dos mártires continue sendo a semente da Igreja. Que eles vejam o teu rosto com clareza proporcional à sua tribulação.',cat:'intercecao',src:'Hebreus 13:3 (NVI)',dif:3,tags:['perseguição','mártires','fortaleza','irmãos']},
{id:104,title:'Pelos Missionários',text:'Senhor dos exércitos, abençoa aqueles que partiram para campos distantes por amor ao teu nome. Dá-lhes saúde, idioma, abertura de portas e fruto que permaneça. Renova suas forças quando sentirem saudade e solidão. Que cada semente plantada germine e produza uma colheita abundante para tua glória.',cat:'intercecao',src:'Romanos 10:15; João 15:16 (NVI)',dif:2,tags:['missões','missionários','fruto','proteção']},
{id:105,title:'Pelas Crianças',text:'Senhor Jesus, que disseste "deixem as crianças virem a mim, e não as impeçam", abençoa cada criança que conheço. Protege-as do Maligno. Que cresçam em sabedoria, estatura e graça diante de Deus e dos homens. Que nenhuma pedra de tropeço seja posta diante delas. Que conheçam teu amor desde a mais tenra idade.',cat:'familia',src:'Marcos 10:14; Lucas 2:52 (NVI)',dif:2,tags:['crianças','proteção','crescimento','amor']},
{id:106,title:'Pelos Idosos',text:'Senhor, que prometeste não abandonar os que chegam à velhice, abençoa os que chegaram a essa fase da vida. Que não se sintam esquecidos nem inúteis, pois seus dias de experiência e oração são preciosos. Dá-lhes saúde para seguir, paz para descansar e a certeza de que o melhor ainda está por vir.',cat:'familia',src:'Salmo 71:9,18; Isaías 46:4 (NVI)',dif:2,tags:['idosos','velhice','paz','continuidade']},
{id:107,title:'Pelos Pobres e Marginalizados',text:'Senhor, quem tem misericórdia do pobre empresta ao Senhor, e ele o recompensará pelo que fez. Abre meus olhos para enxergar os invisíveis ao meu redor. Que eu não passe pelo lado do ferido sem ajudá-lo. Que minha fé seja demonstrada em obras. Usa-me como instrumento da tua justiça.',cat:'intercecao',src:'Provérbios 19:17; Tiago 2:14-17 (NVI)',dif:2,tags:['pobres','justiça','obras','compaixão']},
// ── MOMENTOS DO DIA ───────────────────────────────
{id:108,title:'Ao Acordar',text:'Bom dia, Pai. Obrigado pela noite de sono. Obrigado pelo novo dia que nenhum trabalho humano poderia me dar. Consagro cada hora de hoje ao teu serviço. Que minha primeira palavra seja de louvor. Que meu primeiro pensamento seja de ti. Começo este dia na tua presença.',cat:'manha',src:'Oração ao acordar',dif:1,tags:['manhã','início','presença','louvor']},
{id:109,title:'Antes das Refeições — Simples',text:'Senhor, obrigado por este alimento. Que nutra meu corpo para te servir. Que eu nunca esqueça os que não têm. Amém.',cat:'gratidao',src:'Oração antes das refeições',dif:1,tags:['refeição','gratidão','simplicidade']},
{id:110,title:'Antes das Refeições — Completa',text:'Pai celestial, em teu nome nos reunimos à mesa. Abençoa este alimento que provém das tuas mãos. Abençoa os que o prepararam com amor. Que este momento de refeição seja também de comunhão e de gratidão. Lembra-nos dos que hoje não têm o que comer. Que nunca tomemos por garantido o que recebemos da tua graça. Amém.',cat:'gratidao',src:'Oração à mesa cristã',dif:1,tags:['refeição','comunhão','gratidão','mesa']},
{id:111,title:'Antes de Dormir — Exame de Consciência',text:'Senhor, ao encerrar este dia, faço um exame diante de ti. Onde errei, perdoa-me. Onde acertei, toda glória é tua. Onde fui tentado e venci, obrigado. Onde fui tentado e cedi, cobre com tua misericórdia. Guarda meu sono. Que ao despertar, seja com teu louvor nos lábios.',cat:'noite',src:'Oração noturna de exame',dif:1,tags:['noite','exame','perdão','sono']},
{id:112,title:'Em Tempo de Ansiedade',text:'Senhor, minha mente não para. Mas não devo andar ansioso por coisa alguma; em tudo, pela oração e súplicas, com ação de graças, devo apresentar meus pedidos a Deus. Então aqui estou, depositando cada preocupação a teus pés. Recebo agora a tua paz que excede todo o entendimento.',cat:'paz',src:'Filipenses 4:6-7 (NVI)',dif:2,tags:['ansiedade','paz','preocupação','confiança']},
{id:113,title:'Em Tempo de Crise Financeira',text:'Senhor, não sei como vou pagar minhas contas. Mas lembro que o mesmo Deus que alimentou cinco mil com cinco pães ainda está no trono. Que cuida dos pássaros e dos lírios do campo. Que prometeu suprir todas as minhas necessidades de acordo com as gloriosas riquezas de Cristo Jesus. Confio em ti.',cat:'trabalho',src:'Mateus 6:26; Filipenses 4:19 (NVI)',dif:2,tags:['crise','finanças','confiança','provisão']},
{id:114,title:'Ao Entrar em uma Reunião',text:'Senhor, entro nesta reunião e te peço que venhas comigo. A resposta gentil desvia a ira, mas a palavra dura aumenta o furor. Coloca palavras sábias em minha boca. Que eu seja rápido para ouvir, lento para falar e lento para me irar. Que tua graça seja manifesta em mim.',cat:'trabalho',src:'Provérbios 15:1; Tiago 1:19 (NVI)',dif:1,tags:['reunião','trabalho','sabedoria','discernimento']},
{id:115,title:'Pela Criatividade',text:'Senhor, tu que és o Criador de todas as coisas, inspira minha criatividade. Tu encheste Bezalel do Espírito de Deus, com habilidade, inteligência e conhecimento em todo tipo de artesanato. Faz isso em mim também. Que o que eu criar reflita a excelência do Criador. Que minha obra seja uma oferenda a ti.',cat:'trabalho',src:'Êxodo 31:3 (NVI)',dif:2,tags:['criatividade','arte','excelência','criação']},
{id:116,title:'Por Vizinhos e Comunidade',text:'Senhor, que me mandaste amar o meu próximo como a mim mesmo, começo pelos vizinhos mais imediatos. Abençoa os que moram ao meu redor. Que eu seja boa notícia para minha comunidade. Que minha presença traga paz e não conflito. Que eu saiba o nome de quem mora ao meu lado e me importe com sua história.',cat:'intercecao',src:'Mateus 22:39; Lucas 10:36-37 (NVI)',dif:1,tags:['vizinhos','comunidade','amor','proximidade']},
// ── ORAÇÕES BÍBLICAS ESPECÍFICAS ──────────────────
{id:117,title:'Cântico de Moisés — Mar Vermelho',text:'Cantarei ao Senhor, pois triunfou gloriosamente; o cavalo e o seu cavaleiro lançou ao mar. O Senhor é a minha força e o meu cântico; ele se tornou a minha salvação. Ele é o meu Deus, e eu o louvarei; ele é o Deus do meu pai, e eu o exaltarei. O Senhor é guerreiro; o Senhor é o seu nome.',cat:'grandes_oracoes',src:'Êxodo 15:1-3 (NVI)',dif:3,tags:['moisés','libertação','vitória','cântico']},
{id:118,title:'Oração de Josafá — Não Sabemos o Que Fazer',text:'Senhor, Deus de nossos antepassados, não és tu o Deus que está no céu? Não governas tu sobre todos os reinos das nações? Em tua mão estão o poder e a força, e ninguém pode resistir-te. Não sabemos o que fazer, mas os nossos olhos estão postos em ti.',cat:'forca',src:'2 Crônicas 20:6,12 (NVI)',dif:3,tags:['josafá','fé','poder','dependência']},
{id:119,title:'Oração de Ezequias',text:'Senhor, Deus de Israel, entronizado entre os querubins, somente tu és o Deus de todos os reinos da terra. Tu fizeste os céus e a terra. Inclina o teu ouvido, Senhor, e escuta; abre os teus olhos, Senhor, e vê. Agora, Senhor nosso Deus, salva-nos, para que todos os reinos da terra saibam que somente tu és o Senhor.',cat:'forca',src:'2 Reis 19:15-16,19 (NVI)',dif:4,tags:['ezequias','clamor','fé','nações']},
{id:120,title:'Oração de Neemias',text:'Senhor, Deus dos céus, grande e temível Deus, que cumpres a tua aliança de amor com os que te amam e obedecem aos teus mandamentos, que os teus ouvidos sejam atentos e os teus olhos abertos para ouvir a oração do teu servo. Confesso os pecados dos israelitas que cometemos contra ti, inclusive eu e a minha família.',cat:'intercecao',src:'Neemias 1:5-6 (NVI)',dif:4,tags:['neemias','confissão','pacto','restauração']},
{id:121,title:'Oração de Jonas',text:'Em minha angústia clamei ao Senhor, e ele me respondeu. Do ventre do sepulcro pedi socorro, e tu ouviste a minha voz. Mas eu, com cantos de ação de graças, te oferecerei sacrifício. O que prometi cumprirei. Do Senhor vem a salvação.',cat:'forca',src:'Jonas 2:2,9 (NVI)',dif:3,tags:['jonas','angústia','resposta','salvação']},
{id:122,title:'Jó — Submissão ao Mistério',text:'Sei que és capaz de fazer todas as coisas e que nenhum dos teus planos pode ser frustrado. Tu me perguntaste: Quem é esse que obscurece o meu conselho sem entendimento? Portanto, declarei coisas que não entendia, coisas maravilhosas demais para mim, que eu não conhecia. Antes, eu só ouvia falar de ti; agora, porém, meus próprios olhos te viram.',cat:'consagracao',src:'Jó 42:2-3,5 (NVI)',dif:4,tags:['jó','submissão','sofrimento','revelação']},
{id:123,title:'Elias — Restauração no Deserto',text:'Senhor, já basta. Mas o anjo do Senhor tocou-o e disse: Levanta-te e come, pois a jornada que está diante de ti é longa demais para você. Senhor, quando me sentir esgotado e querer desistir, toca-me também. Alimenta-me para a jornada que ainda resta. Tu cuidas dos teus servos.',cat:'forca',src:'1 Reis 19:4-7 (NVI)',dif:3,tags:['elias','esgotamento','restauração','força']},
{id:124,title:'Abraão — Intercessão com Ousadia',text:'Longe de ti que mates o justo com o ímpio, e que o justo seja tratado como o ímpio. Longe de ti! O Juiz de toda a terra não praticará a justiça? Senhor, que hoje eu interceda com ousadia pelos que estão em perigo espiritual, sabendo que tu és justo e misericordioso.',cat:'intercecao',src:'Gênesis 18:25 (NVI)',dif:3,tags:['abraão','intercessão','justiça','misericórdia']},
{id:125,title:'Jacó — O Pacto com Deus',text:'Se Deus estiver comigo e me proteger nesta viagem que estou fazendo, e me der comida para comer e roupa para vestir, e eu voltar em paz para a casa do meu pai, então o Senhor será o meu Deus. Senhor, hoje faço este pacto contigo: serei teu e tu serás meu Deus em todos os meus caminhos.',cat:'consagracao',src:'Gênesis 28:20-21 (NVI)',dif:3,tags:['jacó','pacto','proteção','viagem']},
{id:126,title:'Oração de Esdras',text:'Meu Deus, envergonho-me e me humilho demais para levantar meu rosto a ti, meu Deus, porque as nossas iniquidades se multiplicaram acima das nossas cabeças, e a nossa culpa cresceu até os céus. Mas tu, Deus nosso, nos dispensaste um castigo menor do que as nossas iniquidades merecem e nos concedeste esta libertação.',cat:'penitencia',src:'Esdras 9:6,13 (NVI)',dif:4,tags:['esdras','confissão','culpa','graça']},
// ── ORAÇÕES TEMÁTICAS EXTRAS ──────────────────────
{id:127,title:'Pela Saúde Mental',text:'Senhor, minha mente às vezes parece meu inimigo. Mas tu conservas em paz perfeita aquele cujo pensamento está firme em ti, porque em ti confia. Renova minha mente. Derruba argumentos e todo pensamento altivo que se levanta contra o conhecimento de Deus. Que tua verdade seja mais poderosa que qualquer mentira que minha mente aceite.',cat:'enfermos',src:'Isaías 26:3; 2 Coríntios 10:5 (NVI)',dif:2,tags:['saúde mental','mente','paz','pensamentos']},
{id:128,title:'Pela Libertação de Vícios',text:'Senhor Jesus, tu vieste para libertar os prisioneiros e proclamar liberdade aos cativos. Onde há escravidão em minha vida — seja ao pecado, ao vício, ao medo, ao passado — vem com tua palavra poderosa e quebra essas cadeias. Portanto, se o Filho os libertar, vocês serão verdadeiramente livres.',cat:'forca',src:'Lucas 4:18; João 8:36 (NVI)',dif:2,tags:['liberdade','vício','correntes','libertação']},
{id:129,title:'Proteção da Família Contra o Maligno',text:'Senhor, coloco um muro de proteção espiritual ao redor da minha família. Que nenhuma flecha em chamas do Maligno alcance este lar. Que o anjo do Senhor acampe ao redor dos que o temem e os livre. Que cada membro desta família seja coberto pelo nome de Jesus. Amém.',cat:'protecao',src:'Salmo 34:7; Efésios 6:16 (NVI)',dif:2,tags:['proteção','família','anjos','guerra espiritual']},
{id:130,title:'Para Quem Está Solteiro',text:'Senhor, nesta fase em que estou, que eu aprenda a ser completo em ti e não na presença de outro ser humano. Usa este tempo para me moldar e me amadurecer. Se for tua vontade que eu me case, prepara-me e prepara aquele ou aquela que virá. Se for tua vontade que eu sirva a ti em celibato, que isso também seja suficiente.',cat:'familia',src:'1 Coríntios 7:34; Salmo 16:5 (NVI)',dif:2,tags:['solteiro','contentamento','missão','preparação']},
{id:131,title:'Na Espera de Uma Promessa',text:'Senhor, esperarei como Abraão esperou. Como Ana esperou. Como os apóstolos esperaram no cenáculo. Sem vacilar na promessa pela incredulidade, sou fortalecido na fé, dando glória a Deus, plenamente convicto de que Deus é capaz de cumprir o que prometeu. As promessas de Deus são todas sim em Cristo. Amém.',cat:'forca',src:'Romanos 4:20-21; 2 Coríntios 1:20 (NVI)',dif:3,tags:['espera','promessa','fé','paciência']},
{id:132,title:'Unção para Orar em Público — Atos 3',text:'Senhor, quando Pedro e João encontraram aquele homem coxo, eles disseram: prata e ouro não possuo, mas o que tenho te dou: em nome de Jesus Cristo de Nazaré, levanta-te e anda. Eu também não tenho eloquência, mas tenho o nome de Jesus. Usa minha boca fraca como instrumento do teu poder.',cat:'orar_publico',src:'Atos 3:6 (NVI)',dif:2,tags:['unção','público','poder','nome de Jesus']},
{id:133,title:'Pelos Inimigos',text:'Senhor Jesus, tu que oraste pelo perdão daqueles que te crucificaram, ajuda-me a orar pelos que me causaram dano. Amem os seus inimigos e orem pelos que os perseguem. Não consigo fazer isso na minha própria força. Mas ao orar por eles hoje, que o teu amor flua através de mim. Transforma-nos a ambos.',cat:'penitencia',src:'Mateus 5:44 (NVI)',dif:3,tags:['inimigos','perdão','amor','transformação']},
{id:134,title:'Oração de Contentamento',text:'Aprendi a estar contente em qualquer situação. Sei o que é passar necessidade e sei o que é ter abundância. Em tudo e em todas as circunstâncias aprendi o segredo de estar satisfeito tanto na fartura como na necessidade. Posso tudo por meio daquele que me fortalece. Que este contentamento reine em meu coração hoje.',cat:'paz',src:'Filipenses 4:11-13 (NVI)',dif:2,tags:['contentamento','paz','fortaleza','gratidão']},
{id:135,title:'Por Língua Guardada',text:'Senhor, põe uma guarda à minha boca; vigia a porta dos meus lábios. Que nenhuma palavra corrompida saia da minha boca, mas somente a que for boa para edificar, conforme a necessidade, para transmitir graça aos que ouvem. Que minhas palavras sejam como mel para o coração e saúde para os ossos.',cat:'sabedoria',src:'Salmo 141:3; Efésios 4:29 (NVI)',dif:2,tags:['língua','palavras','guarda','edificação']},
{id:136,title:'Pela Igreja Universal',text:'Senhor, a tua Igreja é composta de todas as tribos, línguas, povos e nações. Que eu nunca esqueça que faço parte de um corpo maior do que minha denominação. Une-nos no essencial. Dá-nos graça nas diferenças. Com isso todos saberão que somos teus discípulos: se nos amarmos uns aos outros.',cat:'intercecao',src:'João 13:35; Apocalipse 7:9 (NVI)',dif:3,tags:['igreja','unidade','amor','tribos']},
{id:137,title:'Gratidão pela Criação',text:'Senhor Criador, que fizeste o céu e a terra, abro meus olhos para a tua obra. Os céus declaram a tua glória; o firmamento proclama as obras das tuas mãos. O sol que aquece, a chuva que faz germinar, as flores que não plantei, o ar que respiro. Cada pôr do sol é tua assinatura. Que eu nunca perca o espanto.',cat:'gratidao',src:'Salmo 19:1-2 (NVI)',dif:2,tags:['criação','natureza','espanto','gratidão']},
{id:138,title:'Antes de Pregar ou Testemunhar',text:'Senhor, abre os meus lábios, e a minha boca proclamará o teu louvor. Que as palavras que saírem de minha boca não sejam minhas, mas tuas. A minha palavra que sai da minha boca não voltará para mim sem ter alcançado o que desejo e ter tido êxito no que a enviei. Que haja unção e amor. Amém.',cat:'orar_publico',src:'Salmo 51:15; Isaías 55:11 (NVI)',dif:2,tags:['pregação','testemunho','unção','palavra']},
{id:139,title:'Oração de Getsêmani — Rendição',text:'Indo um pouco mais adiante, ele se prostrou com o rosto em terra e orou: Meu Pai, se possível, que este cálice passe de mim; contudo, não seja como eu quero, mas como tu queres. Senhor, quando estou diante de algo difícil, ajuda-me a entregar como Jesus entregou. Não minha vontade, mas a tua.',cat:'consagracao',src:'Mateus 26:39 (NVI)',dif:2,tags:['getsêmani','rendição','vontade','sofrimento']},
{id:140,title:'Sofrimento com Propósito',text:'Senhor, não só isso, mas também nos gloriamos nas tribulações, porque sabemos que a tribulação produz perseverança; a perseverança, um caráter aprovado; e o caráter aprovado, esperança. E a esperança não nos decepciona, porque Deus derramou o seu amor em nossos corações. Que este sofrimento não seja desperdiçado.',cat:'forca',src:'Romanos 5:3-5 (NVI)',dif:3,tags:['sofrimento','propósito','fé','transformação']},
{id:141,title:'Pela Obediência',text:'Senhor, a obediência é melhor do que o sacrifício. Quantas vezes ofereço obras religiosas enquanto desobedeço tua voz clara. Não se limitem a ouvir a palavra, enganando-se a si mesmos; cumpram-na. Dá-me coração obediente. Que eu seja um fazedor da obra, e não apenas um ouvidor esquecadiço.',cat:'consagracao',src:'1 Samuel 15:22; Tiago 1:22 (NVI)',dif:2,tags:['obediência','prática','palavra','coração']},
{id:142,title:'Oração de Quem Perdoou',text:'Senhor, perdoei. Não foi fácil. Mas solto esta pessoa e este acontecimento das mãos. Não lhes digo que perdoem sete vezes, mas setenta vezes sete. Sejam bondosos e compassivos uns para com os outros, perdoando-se mutuamente, assim como Deus os perdoou em Cristo. Estou livre. Eles estão entregues a ti.',cat:'penitencia',src:'Mateus 18:22; Efésios 4:32 (NVI)',dif:2,tags:['perdão','liberdade','rancor','libertação']},
{id:143,title:'Celebração da Ressurreição',text:'Senhor Jesus, tu ressuscitaste! A morte não teve a última palavra. Cristo ressuscitou dentre os mortos, sendo as primícias dos que morreram. Pelo contrário, em tudo somos mais que vencedores por meio daquele que nos amou. Porque tu vives, eu também viverei. Aleluia!',cat:'louvor',src:'1 Coríntios 15:20; Romanos 8:37 (NVI)',dif:2,tags:['ressurreição','vitória','esperança','aleluia']},
{id:144,title:'Por Discernimento Espiritual',text:'Senhor, não creiais em todo espírito, mas provai os espíritos para ver se são de Deus. Dá-me o dom do discernimento. Que eu reconheça a voz do meu Pastor e não siga a voz de estranhos. Que tua Palavra seja o critério de avaliação de tudo que ouço e vejo. Amém.',cat:'sabedoria',src:'1 João 4:1; João 10:4-5 (NVI)',dif:3,tags:['discernimento','espíritos','pastor','palavra']},
