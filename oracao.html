<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oratio — Aprenda a Orar</title>
<style>
:root{--p:#1a237e;--pl:#283593;--a:#ffd700;--al:#fff176;--bg:#0d1117;--s:#161b22;--s2:#21262d;--t:#e6edf3;--tm:#8b949e;--ok:#56d364;--err:#f85149;--warn:#e3b341;--bd:#30363d;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;overflow-x:hidden;}
#app{max-width:768px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.hdr{background:linear-gradient(135deg,var(--p) 0%,#4a148c 100%);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.hdr-logo{font-size:20px;font-weight:700;color:var(--a);letter-spacing:1px;}
.hdr-stats{display:flex;gap:12px;align-items:center;}
.spill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border-radius:20px;padding:5px 12px;font-size:14px;font-weight:600;}
.spill span{color:var(--a);}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:768px;background:var(--s);border-top:1px solid var(--bd);display:flex;z-index:100;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 8px;cursor:pointer;color:var(--tm);transition:color .2s;font-size:11px;gap:3px;}
.ni.on{color:var(--a);}
.ni svg{width:22px;height:22px;}
.pg{flex:1;padding:20px 16px 86px;display:none;}
.pg.on{display:block;}
.card{background:var(--s);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:14px;}
.ct{font-size:17px;font-weight:700;margin-bottom:6px;color:var(--a);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:12px;border:none;cursor:pointer;font-size:15px;font-weight:600;transition:all .2s;width:100%;}
.btn-p{background:linear-gradient(135deg,var(--a),#ff8f00);color:#111;}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,215,0,.3);}
.btn-s{background:var(--s2);color:var(--t);border:1px solid var(--bd);}
.btn-sm{width:auto;padding:8px 16px;font-size:13px;}
.pb{height:8px;background:var(--s2);border-radius:4px;overflow:hidden;margin:8px 0;}
.pf{height:100%;background:linear-gradient(90deg,var(--a),#ff8f00);border-radius:4px;transition:width .5s ease;}
.ptxt{font-size:17px;line-height:1.85;background:var(--s2);padding:18px;border-radius:12px;text-align:left;margin:14px 0;font-style:italic;border-left:4px solid var(--a);}
.psrc{color:var(--a);font-size:12px;text-align:right;margin-top:6px;}
.blank{display:inline-block;border:none;border-bottom:3px solid var(--a);background:transparent;color:var(--a);font-size:17px;font-style:italic;min-width:70px;text-align:center;outline:none;padding:1px 4px;}
.blank:focus{background:rgba(255,215,0,.1);border-radius:4px 4px 0 0;}
.wbank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0;}
.wc{padding:7px 14px;background:var(--pl);color:var(--t);border:2px solid var(--p);border-radius:20px;cursor:pointer;font-size:14px;transition:all .2s;user-select:none;}
.wc:hover{border-color:var(--a);color:var(--a);}
.wc.sel{opacity:.35;cursor:default;}
.wc.ok2{background:rgba(86,211,100,.2);border-color:var(--ok);color:var(--ok);}
.wc.bad{background:rgba(248,81,73,.2);border-color:var(--err);color:var(--err);}
.azone{min-height:72px;background:var(--s2);border:2px dashed var(--bd);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin:14px 0;}
.azone .wc{background:rgba(26,35,126,.5);cursor:pointer;}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.cb{padding:14px;background:var(--s2);border:2px solid var(--bd);border-radius:12px;cursor:pointer;font-size:14px;color:var(--t);text-align:center;transition:all .2s;line-height:1.4;}
.cb:hover{border-color:var(--a);}
.cb.ok2{background:rgba(86,211,100,.15);border-color:var(--ok);color:var(--ok);}
.cb.bad{background:rgba(248,81,73,.15);border-color:var(--err);color:var(--err);}
.fc{perspective:1000px;height:260px;cursor:pointer;margin:18px 0;}
.fci{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d;}
.fc.flip .fci{transform:rotateY(180deg);}
.fcf,.fcb{position:absolute;width:100%;height:100%;backface-visibility:hidden;background:linear-gradient(135deg,var(--p),#4a148c);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;border:1px solid rgba(255,215,0,.3);}
.fcb{transform:rotateY(180deg);}
.fcl{font-size:11px;color:rgba(255,215,0,.6);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;}
.fcc{font-size:18px;font-weight:700;color:var(--t);text-align:center;line-height:1.4;}
.fcs{font-size:13px;color:var(--tm);margin-top:10px;font-style:italic;}
.rb{display:flex;gap:8px;margin:14px 0;}
.rbtn{flex:1;padding:11px;border:none;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;}
.ta{width:100%;min-height:110px;background:var(--s2);border:2px solid var(--bd);border-radius:12px;padding:14px;font-size:15px;color:var(--t);font-family:inherit;resize:none;outline:none;line-height:1.6;transition:border-color .2s;}
.ta:focus{border-color:var(--a);}
.timer{font-size:48px;font-weight:700;color:var(--a);text-align:center;font-variant-numeric:tabular-nums;margin:14px 0;}
.timer.red{color:var(--err);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.catg{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.catc{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:18px 14px;cursor:pointer;transition:all .2s;text-align:center;}
.catc:hover{border-color:var(--a);transform:translateY(-2px);}
.catic{font-size:30px;margin-bottom:6px;}
.catn{font-weight:600;font-size:13px;}
.catk{color:var(--tm);font-size:11px;margin-top:3px;}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.sc{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:18px;text-align:center;}
.sn{font-size:30px;font-weight:700;color:var(--a);}
.sl{font-size:11px;color:var(--tm);margin-top:3px;text-transform:uppercase;letter-spacing:.5px;}
.dcal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:10px 0;}
.dd{aspect-ratio:1;border-radius:3px;background:var(--s2);}
.dd.done{background:var(--a);}
.dd.part{background:#b8860b;}
.toast{position:fixed;top:75px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:11px 22px;font-weight:600;z-index:1000;transition:transform .4s cubic-bezier(.175,.885,.32,1.275);white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{border-color:var(--ok);color:var(--ok);}
.toast.bad{border-color:var(--err);color:var(--err);}
.pli{background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:9px;cursor:pointer;transition:border-color .2s;}
.pli:hover{border-color:var(--a);}
.plt{font-weight:600;margin-bottom:3px;}
.plp{color:var(--tm);font-size:12px;line-height:1.4;}
.plm{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;background:rgba(255,215,0,.15);color:var(--a);}
.diffbar{display:flex;gap:3px;margin-top:5px;}
.star{font-size:10px;color:var(--bd);}
.star.on{color:var(--a);}
.exhdr{text-align:center;margin-bottom:18px;}
.extype{font-size:12px;color:var(--tm);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.extit{font-size:20px;font-weight:700;}
.extip{font-size:13px;color:var(--tm);margin-top:6px;}
.complete{text-align:center;padding:40px 20px;}
.cmp-ico{font-size:68px;margin-bottom:14px;}
.cmp-t{font-size:26px;font-weight:700;color:var(--a);}
.cmp-s{color:var(--tm);margin:6px 0 22px;font-size:15px;}
.xpp{position:fixed;color:var(--a);font-weight:700;font-size:18px;pointer-events:none;animation:xpf 1.5s ease-out forwards;z-index:999;}
@keyframes xpf{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-45px);}}
.prog-bar-row{margin-bottom:10px;}
.prog-lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
.prog-lbl span{color:var(--tm);}
.hint-btn{background:none;border:1px solid var(--bd);color:var(--tm);border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;margin-bottom:10px;}
.hint-btn:hover{border-color:var(--a);color:var(--a);}
.feedback-box{border-radius:12px;padding:16px;margin:12px 0;text-align:left;font-size:14px;line-height:1.7;}
.feedback-box.ok{background:rgba(86,211,100,.1);border:1px solid var(--ok);}
.feedback-box.bad{background:rgba(248,81,73,.1);border:1px solid var(--err);}
.type-diff span.ok2{color:var(--ok);}
.type-diff span.bad{color:var(--err);text-decoration:line-through;}
.type-diff span.mis{color:var(--warn);font-style:italic;}
.lv-badge{display:inline-block;background:linear-gradient(135deg,var(--a),#ff8f00);color:#111;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700;margin-left:8px;}
.pub-box{background:linear-gradient(135deg,#1a237e,#4a148c);border-radius:16px;padding:22px;text-align:center;border:1px solid rgba(255,215,0,.2);}
.pub-timer{font-size:56px;font-weight:700;color:#fff;margin:16px 0;}
.pub-txt{font-size:16px;line-height:1.8;color:#e8d5ff;font-style:italic;text-align:left;background:rgba(255,255,255,.08);border-radius:10px;padding:16px;margin:14px 0;}
.streak-fire{font-size:48px;margin-bottom:8px;}
.daily-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.daily-pct{font-size:28px;font-weight:700;color:var(--a);}
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ex-card{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:16px;cursor:pointer;transition:all .2s;text-align:center;}
.ex-card:hover{border-color:var(--a);transform:translateY(-2px);}
.ex-ico{font-size:28px;margin-bottom:6px;}
.ex-nm{font-weight:600;font-size:13px;}
.ex-ds{color:var(--tm);font-size:11px;margin-top:3px;}
.sep{height:1px;background:var(--bd);margin:16px 0;}
.badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.badge{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;font-size:12px;text-align:center;}
.badge.earned{background:rgba(255,215,0,.1);border-color:var(--a);color:var(--a);}
.back-btn{background:none;border:none;color:var(--tm);cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px;margin-bottom:16px;padding:0;}
.back-btn:hover{color:var(--t);}
select{background:var(--s2);border:1px solid var(--bd);color:var(--t);border-radius:8px;padding:8px 12px;font-size:14px;outline:none;cursor:pointer;}
select:focus{border-color:var(--a);}
@media(max-width:480px){.catg,.ex-grid{grid-template-columns:1fr 1fr;}.cg{grid-template-columns:1fr;}}
</style>
</head>
<body>

<script>
// ═══════════════════════════════════════════════════
// BANCO DE ORAÇÕES
// ═══════════════════════════════════════════════════
const CATS = {
  grandes_oracoes:{label:'Grandes Orações Bíblicas',icon:'📖'},
  manha:{label:'Orações da Manhã',icon:'🌅'},
  noite:{label:'Orações da Noite',icon:'🌙'},
  familia:{label:'Pela Família',icon:'👨‍👩‍👧‍👦'},
  enfermos:{label:'Por Enfermos e Cura',icon:'💊'},
  trabalho:{label:'Trabalho e Provisão',icon:'💼'},
  protecao:{label:'Proteção Espiritual',icon:'🛡️'},
  louvor:{label:'Louvor e Adoração',icon:'🙌'},
  gratidao:{label:'Gratidão',icon:'🙏'},
  forca:{label:'Força e Coragem',icon:'💪'},
  sabedoria:{label:'Sabedoria e Guia',icon:'🌟'},
  consagracao:{label:'Consagração e Rendição',icon:'✝️'},
  penitencia:{label:'Arrependimento e Perdão',icon:'❤️'},
  orar_publico:{label:'Orar em Público',icon:'🎤'},
  intercecao:{label:'Intercessão',icon:'⚡'},
  paz:{label:'Paz Interior',icon:'☮️'},
  anseio:{label:'Busca de Deus',icon:'🔥'},
};

const PRAYERS = [
{id:1,title:'Pai Nosso',text:'Pai nosso que estás nos céus, santificado seja o teu nome. Venha o teu reino, seja feita a tua vontade, assim na terra como no céu. O pão nosso de cada dia nos dá hoje. E perdoa-nos as nossas dívidas, assim como nós perdoamos aos nossos devedores. E não nos deixes cair em tentação, mas livra-nos do mal. Pois teu é o reino, o poder e a glória para sempre. Amém.',cat:'grandes_oracoes',src:'Mateus 6:9-13',dif:2,tags:['jesus','modelo','fundamental']},
{id:2,title:'O Senhor é o Meu Pastor (Salmo 23)',text:'O Senhor é o meu pastor e nada me faltará. Ele me faz repousar em pastos verdejantes. Leva-me para junto das águas tranquilas. Restaura a minha alma. Guia-me pelas veredas da justiça por amor do seu nome. Mesmo que eu ande pelo vale da sombra da morte, não temerei mal algum, porque tu estás comigo. O teu cajado e o teu báculo me consolam. Prepara uma mesa diante de mim na presença dos meus inimigos. Unges a minha cabeça com óleo. O meu cálice transborda. Bondade e misericórdia me seguirão todos os dias da minha vida. E habitarei na casa do Senhor para sempre.',cat:'forca',src:'Salmo 23',dif:3,tags:['salmo','pastor','confiança']},
{id:3,title:'Proteção do Altíssimo (Salmo 91)',text:'Aquele que habita no esconderijo do Altíssimo, e descansa à sombra do Onipotente, diz ao Senhor: Tu és o meu refúgio e o meu castelo. O meu Deus em quem confio. Ele te livrará do laço do passarinheiro e da peste perniciosa. Ele te cobrirá com as suas penas e sob as suas asas te confiarás. A sua verdade é escudo e broquel. Não temerás o terror de noite, nem a seta que voa de dia, porque ordenou aos seus anjos que te guardassem em todos os teus caminhos.',cat:'protecao',src:'Salmo 91',dif:4,tags:['salmo','anjos','segurança']},
{id:4,title:'Deus é o Nosso Refúgio (Salmo 46)',text:'Deus é o nosso refúgio e a nossa força, socorro bem presente nas tribulações. Por isso não temeremos, ainda que a terra se transtorne e os montes sejam removidos para o meio do mar. Ainda que as suas águas rujam e se perturbem, e os montes tremam à fúria das suas ondas. O Senhor dos Exércitos está conosco. O Deus de Jacó é o nosso alto refúgio.',cat:'protecao',src:'Salmo 46:1-3,7',dif:2,tags:['salmo','força','refúgio']},
{id:5,title:'O Senhor é a Minha Luz (Salmo 27)',text:'O Senhor é a minha luz e a minha salvação. A quem temerei? O Senhor é a força da minha vida. De quem me recearei? Quando os maus se aproximaram de mim para comer a minha carne, foram eles mesmos que tropeçaram e caíram. Ainda que um exército se acampasse contra mim, o meu coração não temeria. Numa coisa tenho pedido ao Senhor e a buscarei: que eu habite na casa do Senhor todos os dias da minha vida.',cat:'forca',src:'Salmo 27:1-4',dif:3,tags:['salmo','coragem','luz']},
{id:6,title:'Magnificat — Oração de Maria',text:'A minha alma engrandece ao Senhor e o meu espírito se alegrou em Deus, meu Salvador. Porque atentou para a humildade da sua serva. Pois eis que desde agora todas as gerações me chamarão bem-aventurada. Porque o Todo-Poderoso me fez grandes coisas. Santo é o seu nome. A sua misericórdia vai de geração em geração sobre os que o temem. Dispersou os soberbos no pensamento do seu coração.',cat:'grandes_oracoes',src:'Lucas 1:46-51',dif:3,tags:['maria','louvor','alegria']},
{id:7,title:'Oração Sacerdotal de Jesus',text:'Pai, chegou a hora. Glorifica o teu Filho, para que o teu Filho te glorifique. Assim como lhe deste autoridade sobre toda a carne, para que dê a vida eterna a todos os que lhe deste. E a vida eterna é esta: que te conheçam a ti, o único Deus verdadeiro, e a Jesus Cristo, a quem enviaste. Eu te glorifiquei na terra. Acabei a obra que me deste para fazer.',cat:'grandes_oracoes',src:'João 17:1-4',dif:4,tags:['jesus','glorificação','missão']},
{id:8,title:'Força Interior — Paulo aos Efésios',text:'Dobro os meus joelhos perante o Pai de nosso Senhor Jesus Cristo. Para que vos conceda, segundo as riquezas da sua glória, que sejais fortalecidos com poder pelo seu Espírito no homem interior. Para que Cristo habite pela fé em vossos corações. A fim de que, sendo arraigados e fundados em amor, possais compreender com todos os santos qual é a largura, o comprimento, a altura e a profundidade do amor de Cristo.',cat:'forca',src:'Efésios 3:14-19',dif:4,tags:['paulo','força','amor']},
{id:9,title:'A Paz de Deus',text:'Não andeis ansiosos por coisa alguma. Em tudo, porém, sejam conhecidas, diante de Deus, as vossas petições, pela oração e pela súplica, com ação de graças. E a paz de Deus, que excede todo o entendimento, guardará os vossos corações e os vossos pensamentos em Cristo Jesus.',cat:'paz',src:'Filipenses 4:6-7',dif:2,tags:['paulo','paz','ansiedade']},
{id:10,title:'Oração de Salomão — Dedicação do Templo',text:'Senhor, Deus de Israel, não há Deus como tu, nem em cima nos céus, nem embaixo na terra. Tu que guardas o pacto e a misericórdia com os teus servos que andam diante de ti de todo o seu coração. Atenta para a oração do teu servo e para a sua súplica. Ouve o clamor e a oração que o teu servo faz hoje diante de ti. Para que os teus olhos estejam abertos para esta casa noite e dia.',cat:'grandes_oracoes',src:'1 Reis 8:23-29',dif:3,tags:['salomão','templo','pacto']},
{id:11,title:'Oração de Daniel',text:'Ó Senhor, o grande e tremendo Deus, que guardas o pacto e a misericórdia para com os que te amam e guardam os teus mandamentos. Pecamos e nos tornamos culpados, e nos apartamos dos teus mandamentos. A ti, Senhor, pertence a justiça. A nós a confusão do rosto. Mas ao Senhor nosso Deus pertencem as misericórdias e o perdão. Inclina, ó meu Deus, os teus ouvidos, e ouve.',cat:'grandes_oracoes',src:'Daniel 9:4-9,18',dif:4,tags:['daniel','confissão','misericórdia']},
{id:12,title:'Oração da Serenidade',text:'Senhor, concedei-me a serenidade necessária para aceitar as coisas que não posso modificar. Coragem para modificar as que posso. E sabedoria para distinguir umas das outras. Vivendo um dia de cada vez, desfrutando um momento de cada vez. Aceitando as privações como um caminho para a paz. Confiando que fareis tudo certo se eu me render à vossa vontade.',cat:'sabedoria',src:'Reinhold Niebuhr',dif:2,tags:['serenidade','sabedoria','aceitação']},
{id:13,title:'Oração de São Francisco',text:'Senhor, fazei de mim um instrumento da vossa paz. Onde houver ódio, que eu leve o amor. Onde houver ofensa, que eu leve o perdão. Onde houver discórdia, que eu leve a união. Onde houver dúvida, que eu leve a fé. Onde houver erro, que eu leve a verdade. Onde houver desespero, que eu leve a esperança. Onde houver tristeza, que eu leve a alegria. Ó Mestre, fazei que eu procure mais consolar do que ser consolado.',cat:'consagracao',src:'São Francisco de Assis',dif:3,tags:['francisco','paz','amor','serviço']},
{id:14,title:'Oração de Santo Agostinho',text:'Tu nos fizeste para ti, Senhor, e o nosso coração está inquieto enquanto não repousa em ti. Quem me dará que eu venha repousar em ti? Quem me concederá que venhas ao meu coração e o embriagues, para que me esqueça dos meus males e te abrace, meu único bem? O que és tu para mim? Tem piedade para que eu fale. Que sou eu para ti, para que me ordenes que te ame?',cat:'anseio',src:'Confissões — Santo Agostinho',dif:3,tags:['agostinho','busca','repouso']},
{id:15,title:'Bênção Sacerdotal',text:'O Senhor te abençoe e te guarde. O Senhor faça resplandecer o seu rosto sobre ti e tenha misericórdia de ti. O Senhor levante sobre ti a sua face e te dê a paz.',cat:'grandes_oracoes',src:'Números 6:24-26',dif:1,tags:['bênção','paz','guarda','fundamental']},
{id:16,title:'Entrada no Dia — Salmo 5',text:'Dá ouvidos às minhas palavras, ó Senhor. Considera o meu gemir. Presta atenção à voz do meu clamor. Meu Rei e meu Deus, porque a ti oro. De manhã ouvirás a minha voz. De manhã eu me dirigirei a ti e esperarei. Pois tu não és um Deus que se compraz na iniquidade. Mas eu pela tua grande misericórdia entrarei na tua casa.',cat:'manha',src:'Salmo 5:1-3,7',dif:2,tags:['manhã','clamor','espera']},
{id:17,title:'Oração da Manhã — Dedicação do Dia',text:'Senhor, obrigado por mais um dia de vida. Que eu possa viver este dia para a tua glória. Guia os meus passos, as minhas palavras e os meus pensamentos. Que tua presença me acompanhe em cada momento. Que eu seja instrumento do teu amor em tudo que fizer hoje. Remove de mim o orgulho e enche-me de humildade e amor. Para a glória do teu nome. Amém.',cat:'manha',src:'Oração matinal cristã',dif:1,tags:['manhã','gratidão','guia','vida']},
{id:18,title:'Oração da Noite — Salmo 4 e 17',text:'Em paz me deito e logo adormeço, porque só tu, Senhor, me fazes habitar em segurança. Tu me alegras mais do que os que têm muito trigo e vinho em abundância. Guarda-me como a menina dos olhos. Esconde-me à sombra das tuas asas. Ao despertar me satisfarei com a tua semelhança. Em paz repousarei, porque tu, Senhor, me fazes viver em segurança.',cat:'noite',src:'Salmo 4:7-8; 17:8,15',dif:2,tags:['noite','sono','paz','segurança']},
{id:19,title:'Bênção sobre a Família',text:'Senhor, abençoa este lar. Que Cristo seja o fundamento desta casa. Que o amor seja a linguagem desta família. Que o perdão seja praticado quando houver falha. Que a Palavra de Deus seja o pão diário desta mesa. Afasta de nós a discórdia e o amargo espírito. Que as gerações vindouras possam dizer: nesta casa habitou o Senhor. Amém.',cat:'familia',src:'Oração pelo lar cristão',dif:2,tags:['família','lar','amor','bênção']},
{id:20,title:'Oração pelos Filhos',text:'Senhor, tu conheces cada filho que me deste melhor do que eu os conheço. Guia-os pelo teu caminho. Protege-os do mal. Levanta homens e mulheres de caráter que os façam crescer na fé. Que eles te conheçam desde jovens e nunca se afastem de ti. Coloca em seus corações o amor pela tua Palavra. Que sejam árvores plantadas junto às correntes das águas. Amém.',cat:'familia',src:'Oração pelos filhos',dif:2,tags:['família','filhos','proteção','fé']},
{id:21,title:'Oração pelos Pais',text:'Senhor, abençoa meus pais. Recompensa-os por todo o amor que derramaram sobre mim. Dá-lhes saúde, paz e alegria nos seus dias. Se ainda não te conhecem, que possam encontrar-te. Se já te conhecem, aprofunda sua fé. Honra-os pelo teu amor, pois o teu mandamento promete uma vida longa a quem os honra. Que em seus últimos dias conheçam a tua paz que excede todo entendimento. Amém.',cat:'familia',src:'Oração pelos pais',dif:2,tags:['família','pais','bênção','saúde']},
{id:22,title:'Oração por Enfermos',text:'Senhor Jesus, tu que percorreste a Galileia curando todos os enfermos, olha com misericórdia para aqueles que estão doentes. Toca-os com a tua mão poderosa. Que a tua cura flua sobre eles. Fortifica os médicos e enfermeiros que os tratam. Dá aos familiares força para suportar. Que nesta provação tu sejas glorificado e que a fé deles não vacile. Amém.',cat:'enfermos',src:'Mateus 4:23; Tiago 5:14',dif:2,tags:['cura','enfermidade','misericórdia']},
{id:23,title:'Pelas Chagas de Jesus — Cura',text:'Senhor, a tua Palavra declara que pelas chagas de Jesus somos curados. Aproximo-me do trono da graça e reclamo esta promessa sobre este que está enfermo. Que o poder que ressuscitou Cristo dos mortos opere neste corpo. Que a saúde retorne em nome de Jesus. Que o gozo do Senhor seja a sua força nos dias de prova. Cremos e declaramos: serás curado. Amém.',cat:'enfermos',src:'Isaías 53:5; Romanos 8:11',dif:3,tags:['cura','promessa','poder']},
{id:24,title:'Por um Emprego Digno',text:'Senhor, tu és o provedor de todas as coisas. Coloca diante de mim a oportunidade certa no tempo certo. Que meu trabalho seja um reflexo do teu caráter. Abre portas que nenhum homem possa fechar. Dá-me favor diante das pessoas. Que eu trabalhe como para o Senhor, e não para os homens. Que meu trabalho honre teu nome e sustente minha família. Amém.',cat:'trabalho',src:'Colossenses 3:23; Apocalipse 3:8',dif:2,tags:['trabalho','emprego','provisão','favor']},
{id:25,title:'Pela Provisão Financeira',text:'Senhor, tu prometeste que o justo nunca seria desamparado, nem veria seus descendentes mendigando pão. Confio em ti como meu provedor. Que minha mão seja aberta para dar e que tu possas abrir as janelas dos céus sobre minha vida. Que eu administre bem o que me confiastes. Afasta de mim a avareza e a ansiedade pelo amanhã. Amém.',cat:'trabalho',src:'Salmo 37:25; Malaquias 3:10',dif:3,tags:['finanças','provisão','confiança']},
{id:26,title:'Oração por Sabedoria',text:'Senhor, como Salomão pediu sabedoria acima de todas as riquezas, peço-te hoje que me dês entendimento. Que eu possa discernir o bem do mal, a verdade do erro. Que tua Palavra seja lâmpada para os meus pés e luz para o meu caminho. Enche-me do Espírito Santo para que eu possa tomar decisões sábias. Se algum de vós necessita de sabedoria, peça a Deus, que a dá liberalmente. Amém.',cat:'sabedoria',src:'1 Reis 3:9; Salmo 119:105; Tiago 1:5',dif:3,tags:['sabedoria','discernimento','espírito']},
{id:27,title:'Antes de Orar em Público',text:'Senhor, eu não venho com palavras sábias nem com eloquência humana. Venho apenas com o teu nome. Cobre minha boca com tua graça. Que quando eu abrir a boca, tu fales. Tira de mim o temor do homem, que é um laço. Que o amor que tens por este povo seja maior que qualquer medo que eu sinta. Usa-me, ó Deus, como vaso de barro cheio do teu Espírito. Amém.',cat:'orar_publico',src:'1 Coríntios 2:1-5; Provérbios 29:25',dif:2,tags:['público','coragem','medo','voz']},
{id:28,title:'Coragem para Servir',text:'Senhor, não sou digno de estar diante de ti. Mas tu mesmo me chamaste. Aqui estou. Usa-me como instrumento da tua vontade. Que não seja eu quem fala, mas o teu Espírito em mim. Dá-me coragem quando sentir medo, palavras quando não souber o que falar, e amor quando não tiver forças. Que eles vejam a ti e não a mim. Para a glória do teu nome. Amém.',cat:'orar_publico',src:'Isaías 6:8; Mateus 10:19-20',dif:2,tags:['serviço','espírito','coragem','público']},
{id:29,title:'Louvor — Salmo 100',text:'Celebrai o Senhor alegremente, todas as terras. Servi ao Senhor com alegria. Entrai perante ele com cântico. Sabei que o Senhor é Deus. Ele nos fez e lhe pertencemos. Somos o seu povo e as ovelhas do seu pasto. Entrai pelas suas portas com louvor, nos seus átrios com hinos. Bendizei-o e louvai o seu nome. Porque o Senhor é bom e sua misericórdia dura para sempre.',cat:'louvor',src:'Salmo 100',dif:2,tags:['louvor','adoração','alegria','misericórdia']},
{id:30,title:'Ação de Graças',text:'Pai celeste, teu nome seja louvado por todos os teus benefícios. Por cada manhã de vida, por cada refeição à mesa, por cada abraço recebido e por cada prova que me tornou mais forte. Que a gratidão flua de mim como um rio perene. Que eu nunca me esqueça do teu amor. Em tudo dai graças, pois esta é a vontade de Deus em Cristo Jesus para convosco.',cat:'gratidao',src:'1 Tessalonicenses 5:18',dif:2,tags:['gratidão','bênção','louvor']},
{id:31,title:'Oração pela Nação',text:'Senhor Deus, olha para esta nação. Se o teu povo se humilhar, orar, buscar a tua face e se converter dos seus maus caminhos, tu ouvirás do céu, perdoarás o pecado e sanarás esta terra. Levanta governantes tementes a Deus, juízes íntegros e líderes comprometidos com a justiça. Que tua vontade seja feita aqui como no céu. Amém.',cat:'intercecao',src:'2 Crônicas 7:14',dif:3,tags:['nação','intercessão','governo','justiça']},
{id:32,title:'Oração de Arrependimento — Salmo 51',text:'Misericórdia de mim, ó Deus, segundo a tua bondade. Apaga as minhas transgressões segundo a multidão das tuas misericórdias. Lava-me completamente da minha iniquidade e purifica-me do meu pecado. Cria em mim um coração puro, ó Deus. E renova em mim um espírito reto. Não me rejeites da tua presença e não retires de mim o teu Espírito Santo.',cat:'penitencia',src:'Salmo 51:1-2,10-11',dif:3,tags:['perdão','arrependimento','purificação']},
{id:33,title:'Confiança nas Provações — Habacuque',text:'Senhor, ainda que a figueira não floresça e não haja frutos nas videiras, ainda que o produto da oliveira minta e os campos não produzam mantimento, ainda que o rebanho seja cortado dos currais e não haja gado nas manjedouras, todavia me alegrarei no Senhor e me regozijarei no Deus da minha salvação.',cat:'forca',src:'Habacuque 3:17-18',dif:4,tags:['fé','adversidade','alegria','confiança']},
{id:34,title:'A Armadura de Deus',text:'Senhor, revisto-me hoje com toda a armadura de Deus. Cingo os meus lombos com a verdade. Visto a couraça da justiça. Calço os pés com a preparação do evangelho da paz. Pego o escudo da fé com que posso apagar todos os dardos inflamados do maligno. Tomo o capacete da salvação e a espada do Espírito, que é a Palavra de Deus. Amém.',cat:'protecao',src:'Efésios 6:14-17',dif:3,tags:['proteção','armadura','espiritual']},
{id:35,title:'Busca de Deus — Salmo 42',text:'Como o cervo anseia pelas correntes das águas, assim minha alma anseia por ti, ó Deus. A minha alma tem sede de Deus, do Deus vivo. Quando virei e me apresentarei diante de Deus? Por que estás abatida, ó minha alma? E por que te perturbas dentro de mim? Espera em Deus, porque ainda o louvarei. Ele é a salvação do meu rosto e o meu Deus.',cat:'anseio',src:'Salmo 42:1-2,5',dif:3,tags:['sede','anseio','esperança','alma']},
{id:36,title:'Entrega Total',text:'Senhor, apresento o meu corpo como sacrifício vivo, santo e agradável a ti, que é o meu culto racional. E não me conformo com este século, mas me transformo pela renovação da minha mente, para que experimente qual seja a boa, agradável e perfeita vontade de Deus. Aqui estou, Senhor, todo rendido a ti.',cat:'consagracao',src:'Romanos 12:1-2',dif:3,tags:['consagração','rendição','transformação']},
{id:37,title:'Louvai ao Senhor — Salmo 150',text:'Louvai ao Senhor! Louvai a Deus no seu santuário. Louvai-o no firmamento do seu poder. Louvai-o pelos seus atos poderosos. Louvai-o segundo a sua excelente grandeza. Louvai-o ao som de trombeta. Louvai-o com saltério e harpa. Louvai-o com tamborim e dança. Louvai-o com instrumentos de cordas e flauta. Todo ser que respira louve ao Senhor. Aleluia!',cat:'louvor',src:'Salmo 150',dif:2,tags:['louvor','adoração','música','alegria']},
{id:38,title:'Oração de Rendição',text:'Senhor Jesus, venho diante de ti com mãos abertas e coração humilde. Não tenho nada a oferecer além de mim mesmo. Toma a minha vida, toma os meus planos, toma os meus medos. Eu confio em ti. Não mais a minha vontade, mas a tua. Guia-me onde quiseres, usa-me como entenderes, porque tu és o Senhor da minha vida.',cat:'consagracao',src:'Lucas 22:42; Romanos 12:1',dif:2,tags:['rendição','confiança','humildade']},
{id:39,title:'Renovação da Mente',text:'Senhor, transforma a minha mente pelo poder do teu Espírito Santo. Arranca pensamentos de dúvida, de medo e de derrota. Planta em mim pensamentos de fé, de esperança e de vitória. Que eu pense o que é verdadeiro, honesto, justo, puro, amável e de boa fama. Que minha mente seja o templo do teu Espírito. Amém.',cat:'consagracao',src:'Romanos 12:2; Filipenses 4:8',dif:2,tags:['mente','renovação','pensamentos']},
{id:40,title:'Intercessão pelo Próximo',text:'Senhor, venho interceder por aqueles que colocaste em meu coração. Sou apenas um mensageiro entre eles e ti. Pela autoridade que me deste em Cristo Jesus, declaro que o teu reino vem para cada vida. Que o teu Espírito os convença, que o teu amor os cure, e que a tua graça os salve. Em nome de Jesus. Amém.',cat:'intercecao',src:'1 Timóteo 2:1; João 16:23',dif:3,tags:['intercessão','reino','espírito']},
{id:41,title:'Oração de Hannah',text:'O meu coração se alegra no Senhor. A minha força é exaltada no Senhor. Porque me alegro na tua salvação. Ninguém é santo como o Senhor, porque não há outro além de ti. Não há rocha como o nosso Deus. O Senhor mata e dá vida, faz descer à sepultura e faz subir. O Senhor empobrece e enriquece. Abaixa e também levanta.',cat:'grandes_oracoes',src:'1 Samuel 2:1-7',dif:4,tags:['hannah','louvor','poder']},
{id:42,title:'Viver é Cristo',text:'Senhor, que para mim o viver seja Cristo e o morrer seja ganho. Que eu seja conformado à imagem do teu Filho. Que não seja mais eu quem vive, mas Cristo que vive em mim. E a vida que agora vivo na carne, vivo-a pela fé no Filho de Deus, que me amou e se entregou a si mesmo por mim.',cat:'consagracao',src:'Filipenses 1:21; Gálatas 2:20',dif:3,tags:['cristo','vida','rendição']},
{id:43,title:'Paz que Excede o Entendimento',text:'Senhor, tu és o Príncipe da Paz. Fala a esta tempestade interior e dize: aquieta-te, sossega. Que a tua paz, que excede todo o entendimento, guarde o meu coração e os meus pensamentos em Cristo Jesus. Que eu possa repousar em ti como o discípulo que se recostou no peito de Jesus. Tu és minha paz. Amém.',cat:'paz',src:'Filipenses 4:7; Marcos 4:39; João 13:23',dif:2,tags:['paz','descanso','tempestade']},
{id:44,title:'Iluminação Espiritual — Efésios 1',text:'Pai de glória, que o Deus de nosso Senhor Jesus Cristo vos dê espírito de sabedoria e de revelação no pleno conhecimento dele. Os olhos do vosso coração sendo iluminados, para que saibais qual é a esperança do seu chamamento, e quais as riquezas da glória da sua herança nos santos.',cat:'sabedoria',src:'Efésios 1:17-18',dif:4,tags:['sabedoria','revelação','conhecimento']},
{id:45,title:'Oração pela Colheita Espiritual',text:'Senhor da messe, a messe é grande e os obreiros são poucos. Suplica ao Senhor da messe que mande obreiros para a sua messe. Que aqueles que ouviram a tua voz sejam enviados. Que aqueles que ainda não ouviram sejam alcançados. Que a tua Igreja cresça com vigor e que o teu nome seja glorificado entre todas as nações. Amém.',cat:'intercecao',src:'Mateus 9:37-38',dif:3,tags:['missões','evangelismo','colheita']},
{id:46,title:'Declaração de Fé',text:'Senhor, creio que és o Deus que criou os céus e a terra. Creio que enviaste teu Filho Jesus para morrer pelos meus pecados e ressuscitar para a minha justificação. Creio que o teu Espírito habita em mim. Creio em todas as tuas promessas. Pela fé, sou mais do que vencedor através daquele que me amou.',cat:'forca',src:'João 3:16; Romanos 8:37',dif:2,tags:['fé','declaração','vitória']},
{id:47,title:'Unidade da Igreja',text:'Pai Santo, que todos sejam um, como tu és em mim e eu em ti, que eles também sejam um em nós. Para que o mundo creia que tu me enviaste. A glória que me deste, dei-a a eles, para que sejam um como nós somos um. Eu neles e tu em mim, para que sejam aperfeiçoados em unidade.',cat:'intercecao',src:'João 17:21-23',dif:3,tags:['unidade','igreja','testemunho']},
{id:48,title:'Amor ao Próximo',text:'Senhor Jesus, tu que dijste que o maior mandamento é amar a Deus e ao próximo, enche-me deste amor que vai além das palavras. Que eu ame com ações e em verdade. Que eu veja nos outros a tua imagem. Que eu não passe por alguém necessitado como o sacerdote passou pelo lado do ferido. Faz de mim o samaritano. Amém.',cat:'consagracao',src:'Mateus 22:37-39; 1 João 3:18',dif:2,tags:['amor','serviço','próximo']},
{id:49,title:'Oração de Elias no Monte Carmelo',text:'Senhor, Deus de Abraão, de Isaque e de Israel, seja manifesto hoje que tu és Deus em Israel e que eu sou teu servo, e que fiz todas estas coisas segundo a tua palavra. Responde-me, ó Senhor, responde-me, para que este povo saiba que tu és o Senhor Deus e que tornaste o coração deles.',cat:'grandes_oracoes',src:'1 Reis 18:36-37',dif:4,tags:['elias','poder','nação']},
{id:50,title:'Vem, Espírito Santo',text:'Vem, Espírito Santo, enche este coração. Que a tua presença seja sentida aqui e agora. Que o teu fogo purifique e o teu amor transforme. Que onde houver cinzas, tu tragas beleza. Onde houver luto, manto de louvor. Onde houver espírito angustiado, alegria celestial. Vem, Espírito da graça. Amém.',cat:'anseio',src:'Isaías 61:3; João 14:16',dif:2,tags:['espírito','fogo','presença']},
{id:51,title:'Salmo 103 — Bênçãos do Senhor',text:'Bendize, ó minha alma, ao Senhor, e tudo o que há em mim bendiga o seu santo nome. Bendize, ó minha alma, ao Senhor, e não te esqueças de nenhum dos seus benefícios. Ele é quem perdoa todas as tuas iniquidades, quem sara todas as tuas enfermidades, quem resgata da cova a tua vida, quem te coroa de benignidade e misericórdias.',cat:'louvor',src:'Salmo 103:1-4',dif:3,tags:['louvor','bênção','perdão','cura']},
{id:52,title:'Oração para Superar o Medo de Orar',text:'Senhor, o teu perfeito amor lança fora todo o temor. Eu rejeito o espírito de timidez e recebo o espírito de poder, amor e domínio próprio. Quando abrir a boca para orar, que as palavras venham de ti. Que eu lembre que oro para um Pai que me ama e não para uma plateia que me julga. Com ousadia aproximo-me do trono da graça. Amém.',cat:'orar_publico',src:'1 João 4:18; 2 Timóteo 1:7; Hebreus 4:16',dif:2,tags:['medo','timidez','público','ousadia']},
// ── SALMOS ADICIONAIS ──────────────────────────────
{id:53,title:'Bem-aventurado o Varão — Salmo 1',text:'Bem-aventurado o homem que não anda no conselho dos ímpios, nem se detém no caminho dos pecadores, nem se assenta na roda dos escarnecedores. Antes tem o seu prazer na lei do Senhor, e nessa lei medita de dia e de noite. E ele será como uma árvore plantada junto a correntes de águas, que dá o seu fruto na estação própria, e cujas folhas não caem; e tudo quanto fizer prosperará.',cat:'sabedoria',src:'Salmo 1:1-3',dif:2,tags:['salmo','bênção','meditação','prosperidade']},
{id:54,title:'Ó Senhor Nosso Senhor — Salmo 8',text:'Ó Senhor, Senhor nosso, quão admirável é o teu nome em toda a terra, tu que puseste a tua glória acima dos céus! Quando vejo os teus céus, obra dos teus dedos, a lua e as estrelas que estabeleceste, que é o homem, para que te lembres dele? E o filho do homem, para que o visites? E contudo fizeste-o pouco menor do que os anjos e de glória e de honra o coroaste.',cat:'louvor',src:'Salmo 8:1,3-5',dif:2,tags:['salmo','criação','glória','humildade']},
{id:55,title:'Guarda-me, ó Deus — Salmo 16',text:'Guarda-me, ó Deus, porque em ti me refugio. Disse ao Senhor: Tu és o meu Senhor. O Senhor é a porção da minha herança e do meu cálice. Tu sustentas a minha sorte. As linhas me caíram em lugares deliciosos. Tenho uma boa herança. Bendirei ao Senhor, que me aconselha. Pus o Senhor continuamente diante de mim. Não serei abalado, pois ele está à minha direita.',cat:'confianca',src:'Salmo 16:1-2,5-6,8',dif:3,tags:['salmo','refúgio','herança','confiança']},
{id:56,title:'Os Céus Declaram — Salmo 19',text:'Os céus declaram a glória de Deus, e o firmamento anuncia a obra das suas mãos. Dia a dia profere palavra, e noite a noite revela ciência. Sejam aceitas as palavras da minha boca e a meditação do meu coração diante de ti, ó Senhor, rocha minha e redentor meu.',cat:'louvor',src:'Salmo 19:1-2,14',dif:2,tags:['salmo','criação','glória','meditação']},
{id:57,title:'A Ti, ó Senhor — Salmo 25',text:'A ti, ó Senhor, elevo a minha alma. Ó meu Deus, em ti confio. Mostra-me, ó Senhor, os teus caminhos. Ensina-me as tuas veredas. Guia-me na tua verdade e ensina-me, pois tu és o Deus da minha salvação. Lembra-te, ó Senhor, das tuas misericórdias e dos teus favores, porque são desde a eternidade.',cat:'sabedoria',src:'Salmo 25:1-2,4-6',dif:2,tags:['salmo','guia','confiança','misericórdia']},
{id:58,title:'Bendirei ao Senhor em Todo o Tempo — Salmo 34',text:'Bendirei ao Senhor em todo o tempo. O seu louvor estará continuamente na minha boca. No Senhor se gloriará a minha alma. Os humildes ouvirão e se alegrarão. Magnificai o Senhor comigo, e exaltemos juntos o seu nome. Busquei ao Senhor e ele me respondeu, e livrou-me de todos os meus temores. Os que fitam os olhos nele serão iluminados.',cat:'louvor',src:'Salmo 34:1-5',dif:2,tags:['salmo','louvor','alegria','resposta']},
{id:59,title:'A Minha Alma Descansa em Deus — Salmo 62',text:'A minha alma descansa em Deus somente. Dele vem a minha salvação. Somente ele é a minha rocha e a minha salvação. É o meu alto refúgio. Não serei muito abalado. Confia nele em todo o tempo, ó povo. Despejais diante dele o vosso coração. Deus é o nosso refúgio.',cat:'paz',src:'Salmo 62:1-2,8',dif:2,tags:['salmo','descanso','refúgio','confiança']},
{id:60,title:'Sede de Deus — Salmo 63',text:'Ó Deus, tu és o meu Deus. De madrugada te busco. A minha alma tem sede de ti. A minha carne te anseia numa terra seca e árida onde não há água. Assim como no santuário te contemplei para ver o teu poder e a tua glória. Porque a tua benignidade é melhor do que a vida. Os meus lábios te louvarão.',cat:'anseio',src:'Salmo 63:1-3',dif:2,tags:['salmo','sede','busca','louvor']},
{id:61,title:'Quão Amáveis São as Tuas Moradas — Salmo 84',text:'Quão amáveis são as tuas moradas, ó Senhor dos Exércitos. A minha alma anseia e até desfalece pelos átrios do Senhor. O meu coração e a minha carne exultam no Deus vivo. Porque melhor é um dia nos teus átrios do que mil em outro lugar. Prefiro ficar na soleira da casa do meu Deus a habitar nas tendas da impiedade.',cat:'anseio',src:'Salmo 84:1-2,10',dif:3,tags:['salmo','moradas','presença','desejo']},
{id:62,title:'Tu Tens Sido o Nosso Refúgio — Salmo 90',text:'Senhor, tu tens sido o nosso refúgio de geração em geração. Antes que os montes nascessem, ou que tu formasses a terra e o mundo, sim, de eternidade a eternidade, tu és Deus. Ensina-nos a contar os nossos dias, para que alcancemos coração sábio. Satisfaz-nos de manhã com a tua benignidade, para que cantemos de alegria durante todos os nossos dias.',cat:'sabedoria',src:'Salmo 90:1-2,12,14',dif:3,tags:['salmo','eternidade','sabedoria','benignidade']},
{id:63,title:'Levanto os Olhos para os Montes — Salmo 121',text:'Levanto os olhos para os montes. De onde me virá o socorro? O meu socorro vem do Senhor, que fez o céu e a terra. Não deixará vacilar o teu pé. Não dormitará aquele que te guarda. O Senhor é o teu guarda. O Senhor é a tua sombra à tua mão direita. O Senhor te guardará de todo o mal. Guardará a tua alma.',cat:'protecao',src:'Salmo 121',dif:2,tags:['salmo','guarda','socorro','proteção']},
{id:64,title:'Das Profundezas Clamo — Salmo 130',text:'Das profundezas clamo a ti, ó Senhor. Senhor, ouve a minha voz. Sejam os teus ouvidos atentos à voz das minhas súplicas. Se tu, Senhor, conservares a memória das iniquidades, ó Senhor, quem subsistirá? Mas em ti há perdão, para que sejas temido. Espero no Senhor. A minha alma espera e na sua palavra ponho a minha esperança.',cat:'penitencia',src:'Salmo 130:1-4',dif:3,tags:['salmo','profundeza','perdão','esperança']},
{id:65,title:'Tu Me Sondas e Me Conheces — Salmo 139',text:'Senhor, tu me sondas e me conheces. Tu sabes quando me sento e quando me levanto. De longe entendes o meu pensamento. Compasses o meu andar e o meu deitar. Sou formidavelmente maravilhoso nas tuas obras. Maravilhosas são as tuas obras, e a minha alma o sabe muito bem. Esquadrinhai-me, ó Deus, e conhecei o meu coração.',cat:'consagracao',src:'Salmo 139:1-2,4,14,23',dif:3,tags:['salmo','conhecimento','criação','coração']},
{id:66,title:'Ouve a Minha Oração — Salmo 143',text:'Senhor, ouve a minha oração. Dá ouvidos às minhas súplicas. Responde-me pela tua fidelidade e pela tua justiça. A minha alma anseia por ti como terra seca. Faze-me ouvir de manhã a tua benignidade, porque em ti confio. Faze-me conhecer o caminho em que devo andar, pois a ti elevo a minha alma.',cat:'manha',src:'Salmo 143:1,6-8',dif:3,tags:['salmo','súplica','anseio','guia']},
{id:67,title:'Cantai ao Senhor um Cântico Novo — Salmo 96',text:'Cantai ao Senhor um cântico novo. Cantai ao Senhor toda a terra. Cantai ao Senhor, bendizei o seu nome. Proclamai as boas novas da sua salvação de dia em dia. Declarai a sua glória entre as nações, as suas maravilhas entre todos os povos. Porque grande é o Senhor e mui digno de louvor. Temível é ele acima de todos os deuses.',cat:'louvor',src:'Salmo 96:1-4',dif:2,tags:['salmo','cântico','glória','nações']},
{id:68,title:'Esperando Esperiei no Senhor — Salmo 40',text:'Esperando, esperiei no Senhor, e ele se inclinou para mim e ouviu o meu clamor. Tirou-me do poço da ruína, do lamaçal, e pôs os meus pés sobre uma rocha. Pôs em minha boca um novo cântico, um hino de louvor ao nosso Deus. Muitos verão isso e temerão e confiarão no Senhor.',cat:'forca',src:'Salmo 40:1-3',dif:3,tags:['salmo','espera','libertação','cântico']},
{id:69,title:'Nas Tuas Mãos Entrego — Salmo 31',text:'Em ti, Senhor, me refugio. Nunca me deixes envergonhado. Livra-me na tua justiça. Sê para mim uma rocha de refúgio. Uma casa forte para me salvar. Pois tu és a minha rocha e o meu castelo. Nas tuas mãos entrego o meu espírito. Tu me remiste, ó Senhor, Deus de verdade.',cat:'protecao',src:'Salmo 31:1-3,5',dif:3,tags:['salmo','refúgio','entrega','confiança']},
{id:70,title:'Não te Inquietes — Salmo 37',text:'Não te inquietes por causa dos malfeitores. Nem tenhas inveja dos que praticam a injustiça. Confia no Senhor e faz o bem. Habita na terra e alimenta-te da fidelidade. Deleita-te no Senhor e ele te dará os desejos do teu coração. Descansa no Senhor e espera nele.',cat:'paz',src:'Salmo 37:1,3-4,7',dif:2,tags:['salmo','descanso','confiança','desejos']},
// ── ORAÇÕES DO NOVO TESTAMENTO ─────────────────────
{id:71,title:'Oração dos Discípulos — Atos 4',text:'Senhor, tu és o que fizeste o céu e a terra, o mar e tudo que neles há. E agora, Senhor, atenta para as suas ameaças, e concede aos teus servos que falem a tua palavra com toda a ousadia. Estende a tua mão para curas, e para que sinais e maravilhas se façam pelo nome do teu santo Filho Jesus.',cat:'orar_publico',src:'Atos 4:24,29-30',dif:3,tags:['ousadia','sinais','maravilhas','palavra']},
{id:72,title:'Oração de Estêvão — O Primeiro Mártir',text:'Senhor Jesus, recebe o meu espírito. Senhor, não lhes imputes este pecado. Senhor, que mesmo neste momento difícil eu possa perdoar como tu perdoaste. Que minha última palavra seja de amor. Que minha vida e minha morte glorifiquem o teu nome. Em ti confio completamente.',cat:'grandes_oracoes',src:'Atos 7:59-60; Lucas 23:34',dif:3,tags:['estêvão','perdão','espírito','martírio']},
{id:73,title:'Benedictus — Cântico de Zacarias',text:'Bendito seja o Senhor, Deus de Israel, que visitou e redimiu o seu povo. E levantou uma salvação poderosa para nós na casa de Davi seu servo. Servi-lo-emos em santidade e justiça diante dele todos os nossos dias. E tu, menino, serás chamado profeta do Altíssimo. Porque irás adiante do Senhor a preparar os seus caminhos.',cat:'grandes_oracoes',src:'Lucas 1:68-69,75-76',dif:3,tags:['zacarias','redenção','salvação','santidade']},
{id:74,title:'Paulo pelos Colossenses',text:'Por isso, também nós, desde o dia em que o ouvimos, não cessamos de orar por vós e de pedir que sejais cheios do conhecimento da sua vontade em toda a sabedoria e entendimento espiritual. Para que andeis de modo digno do Senhor, agradando-o em tudo, frutificando em toda boa obra e crescendo no conhecimento de Deus.',cat:'sabedoria',src:'Colossenses 1:9-10',dif:3,tags:['paulo','sabedoria','frutificar','crescer']},
{id:75,title:'Paulo pelos Tessalonicenses',text:'O Senhor vos faça crescer e aumentar no amor uns para com os outros e para com todos. Para confirmar os vossos corações irrepreensíveis em santidade diante de nosso Deus e Pai, na vinda de nosso Senhor Jesus Cristo com todos os seus santos.',cat:'familia',src:'1 Tessalonicenses 3:12-13',dif:3,tags:['paulo','amor','santidade','crescer']},
{id:76,title:'O Filho Pródigo Retorna',text:'Pai, pequei contra o céu e diante de ti. Já não sou digno de ser chamado teu filho. Trata-me como a um dos teus servos assalariados. Mas o pai ordenou: Trazei depressa a melhor roupa e vesti-lho. Ponde-lhe um anel no dedo e sandálias nos pés. Este meu filho estava morto e reviveu. Estava perdido e foi achado.',cat:'penitencia',src:'Lucas 15:18-19,22-24',dif:2,tags:['perdão','filho','restauração','graça']},
{id:77,title:'O Ladrão na Cruz',text:'Jesus, lembra-te de mim quando entrares no teu reino. E Jesus disse: Em verdade te digo que hoje estarás comigo no paraíso. Senhor, também eu sou pecador. Não há nada em mim que mereça a tua graça. Mas confio que tua misericórdia é maior que meu pecado. Lembra-te de mim.',cat:'penitencia',src:'Lucas 23:42-43',dif:1,tags:['graça','perdão','paraíso','misericórdia']},
{id:78,title:'Paulo — Deus da Esperança',text:'Ora, o Deus da esperança vos encha de todo o gozo e paz no crer, para que abundeis em esperança pelo poder do Espírito Santo. O Deus de paciência e consolação vos conceda o mesmo sentir uns para com os outros segundo Cristo Jesus. Para que concordemente, a uma voz, glorifiqueis o Deus e Pai de nosso Senhor Jesus Cristo.',cat:'paz',src:'Romanos 15:5-6,13',dif:3,tags:['esperança','paz','gozo','espírito']},
{id:79,title:'Oração Final de Paulo — 2 Coríntios',text:'A graça do Senhor Jesus Cristo, o amor de Deus e a comunhão do Espírito Santo seja com todos vós. Que eu receba cada dia esta graça trinitária. Que o amor do Pai, a graça do Filho e a comunhão do Espírito me cubram do amanhecer ao anoitecer. Amém.',cat:'gratidao',src:'2 Coríntios 13:14',dif:1,tags:['graça','trindade','bênção','amor']},
// ── GRANDES CRISTÃOS ───────────────────────────────
{id:80,title:'Calvino — Início do Dia',text:'Senhor Deus, Pai eterno e todo-poderoso, nós confessamos e reconhecemos de coração que somos indignos de levantar os nossos olhos para o céu para te chamar. Mas como te agradaste de nos mandar invocar o teu santo nome e prometer ouvir as nossas orações, concedei-nos hoje a graça de cumprir o nosso dever.',cat:'manha',src:'João Calvino',dif:3,tags:['calvino','manhã','indignidade','graça']},
{id:81,title:'Lutero — Antes do Trabalho',text:'Senhor Deus, obrigado pela noite de descanso e pelo novo dia. Guia e governa os meus pensamentos e minhas ações para que tudo o que eu faça seja conforme tua vontade. Livra-me de tudo que me afaste de ti. Que eu te sirva com alegria hoje. Amém.',cat:'trabalho',src:'Martinho Lutero',dif:2,tags:['lutero','manhã','trabalho','guia']},
{id:82,title:'Wesley — Consagração Total',text:'Eu não sou mais meu. Sou teu. Coloca-me onde quiseres. Coloca-me com quem quiseres. Faze de mim o que quiseres. Emprega-me no que quiseres. Coloca-me à parte ou junto com os outros. Permite que seja cheio. Permite que seja esvaziado. Permite que eu tenha tudo. Livremente e de todo o coração eu cedo tudo à tua vontade e ao teu agrado.',cat:'consagracao',src:'John Wesley',dif:3,tags:['wesley','consagração','rendição','vontade']},
{id:83,title:'Spurgeon — Por Mais Fé',text:'Senhor, dá-me mais fé. Quando sinto que a fé vacila, ajuda-me a lembrar de tua fidelidade. Quando me sinto fraco, faz-me forte na tua graça. Quando estou tentado a duvidar, lembra-me de todas as vezes que provaste ser fiel. Que minha confiança seja em ti e não em mim mesmo. Amém.',cat:'forca',src:'Charles Spurgeon',dif:2,tags:['spurgeon','fé','graça','força']},
{id:84,title:'Thomas à Kempis — Conhecer o Bem',text:'Dai-me, Senhor, conhecer o que deve ser conhecido, amar o que deve ser amado, louvar o que vos agrada sobremaneira, estimar o que vos é precioso, abominar o que é imundo aos vossos olhos. Não me deixeis julgar segundo o que apareça exteriormente, mas que eu possa discernir as coisas espirituais.',cat:'sabedoria',src:'Thomas à Kempis — Imitação de Cristo',dif:3,tags:['kempis','discernimento','espiritual','amor']},
{id:85,title:'Teresa de Ávila — Nada te Perturbe',text:'Nada te perturbe. Nada te espante. Tudo passa. Deus não muda. A paciência tudo alcança. Quem a Deus tem, nada lhe falta. Só Deus basta. Senhor, ajuda-me a descansar nesta verdade quando tudo ao redor estiver em caos. Tu és minha âncora e meu porto seguro.',cat:'paz',src:'Teresa de Ávila',dif:1,tags:['teresa','paz','paciência','Deus basta']},
{id:86,title:'Bonhoeffer — Na Tribulação',text:'Senhor, seja o que for que este dia traz, tua presença é a minha força. Quando não entendo teus caminhos, que eu confie em teu caráter. Quando os tempos são sombrios, que eu lembre que tu és a luz do mundo. Que minha fé não dependa das circunstâncias, mas do Deus que está acima de todas elas.',cat:'forca',src:'Dietrich Bonhoeffer',dif:3,tags:['bonhoeffer','confiança','tribulação','presença']},
{id:87,title:'Thomas Merton — Caminho Desconhecido',text:'Meu Senhor Deus, não sei para onde estou indo. Não vejo a estrada à minha frente. Não posso saber com certeza onde ela levará. Mas creio que o desejo de te agradar te agrada de fato. E espero ter esse desejo em tudo que faço. Espero nunca fazer nada separado desse desejo.',cat:'consagracao',src:'Thomas Merton',dif:3,tags:['merton','confiança','desejo','caminho']},
{id:88,title:'Finney — Por Avivamento',text:'Ó Senhor, manda um avivamento e que ele comece em mim. Cria em mim um coração limpo. Renova um espírito certo dentro de mim. Que o fogo do teu amor queime tudo que não é teu. Que eu seja quebrantado, curado e cheio do teu Espírito. Que a tua glória cubra esta terra como as águas cobrem o mar.',cat:'anseio',src:'Charles Finney',dif:3,tags:['avivamento','quebrantamento','espírito','glória']},
{id:89,title:'Moody — Por Almas Perdidas',text:'Senhor, transforma-me em alguém que não vive para si mesmo. Que eu tenha tanta compaixão pelas almas perdidas quanto tu tens. Que eu nunca passe por alguém sem pensar em sua eternidade. Usa-me para alcançar os que estão longe de ti. Que nenhum dia passe sem que eu leve alguém para mais perto de ti.',cat:'evangelismo',src:'D.L. Moody',dif:2,tags:['moody','almas','compaixão','evangelismo']},
{id:90,title:'Hudson Taylor — Missão',text:'Senhor, eu tenho apenas uma vida para viver. Que ela seja vivida para ti. Que cada decisão que tomo seja filtrada pela eternidade. O que importará daqui a cem anos? Isso é o que quero fazer hoje. Usa-me no campo que plantaste para mim.',cat:'consagracao',src:'Hudson Taylor',dif:2,tags:['missão','eternidade','vida','decisão']},
// ── ORAÇÕES POR SITUAÇÕES ESPECÍFICAS ────────────────
{id:91,title:'Antes de uma Decisão Importante',text:'Senhor, estou diante de uma escolha que pode mudar o curso da minha vida. Confio em ti com todo o meu coração e não me apoio no meu próprio entendimento. Em todos os meus caminhos te reconheço. Dirige as minhas veredas. Que eu ouça por detrás de mim uma voz dizendo: este é o caminho, andai nele.',cat:'sabedoria',src:'Provérbios 3:5-6; Isaías 30:21',dif:2,tags:['decisão','guia','confiança','direção']},
{id:92,title:'No Tempo de Luto',text:'Senhor, estou com o coração partido. A dor parece maior do que posso suportar. Mas tu és o Deus que está perto dos que têm o coração quebrantado. Chora tu comigo, como choraste diante do túmulo de Lázaro. E quando for o tempo, tira-me desta sepultura para nova vida.',cat:'forca',src:'Salmo 34:18; João 11:35',dif:2,tags:['luto','dor','consolo','quebrantamento']},
{id:93,title:'Pela Cura da Depressão',text:'Senhor, minha alma está abatida. Não consigo ver a saída. Mas lembro que Elias também quis morrer debaixo de uma árvore e tu não o abandonaste — enviaste um anjo com pão. Alimenta-me hoje, Senhor. Levanta-me da cama desta depressão. Que teu Espírito Santo seja o meu conselheiro.',cat:'enfermos',src:'Salmo 42:5; 1 Reis 19:4-8',dif:2,tags:['depressão','cura','esperança','consolo']},
{id:94,title:'Por um Filho Afastado da Fé',text:'Senhor, como o pai do filho pródigo, fico à janela esperando o retorno deste filho que se afastou. Meu amor por ele não muda. Alcança-o onde está. Que um dia ele se levante e venha a ti. Que eu seja capaz de recebê-lo com os braços abertos, como tu me recebeste quando eu estava perdido.',cat:'familia',src:'Lucas 15:20; Romanos 5:8',dif:3,tags:['filho','restauração','retorno','amor']},
{id:95,title:'Antes de uma Cirurgia',text:'Senhor, coloco esta vida nas tuas mãos. Tu me formaste no ventre da minha mãe. Cada um dos meus dias está escrito no teu livro. Guia as mãos dos médicos. Que tua paz guarde meu coração agora. E que seja qual for o resultado, que eu possa dizer: o Senhor deu, o Senhor tirou, bendito seja o nome do Senhor.',cat:'enfermos',src:'Salmo 139:13; Filipenses 4:7; Jó 1:21',dif:2,tags:['cirurgia','medicina','paz','confiança']},
{id:96,title:'Por um Casamento em Crise',text:'Senhor, não foi assim que imaginamos. Mas ainda estamos aqui, ainda temos a aliança que fizemos. Tu odeias o divórcio porque vês a dor que ele causa. Restaura o que o inimigo veio roubar. Cura as feridas que nos demos. Que o amor que um dia sentimos seja renovado. O que Deus uniu, que o homem não separe.',cat:'familia',src:'Malaquias 2:16; Mateus 19:6',dif:3,tags:['casamento','restauração','cura','aliança']},
{id:97,title:'Pela Reconciliação',text:'Senhor, há uma parede entre mim e esta pessoa. Será que sou também culpado nesta situação? Dá-me humildade para reconhecer minha parte. Remove de mim o orgulho que me impede de pedir perdão. Que eu seja o primeiro a estender a mão. Que a paz de Cristo governe este relacionamento.',cat:'penitencia',src:'Mateus 5:23-24; Colossenses 3:15',dif:2,tags:['reconciliação','perdão','humildade','paz']},
{id:98,title:'Antes de Estudar ou Trabalhar',text:'Senhor, dedico este tempo ao teu nome. Ilumina minha mente, aguça minha memória, dá-me concentração e entendimento. Que o conhecimento que adquirir seja usado para teu reino. Que eu trabalhe como para o Senhor. Que cada hora seja redimida e produtiva para a tua glória. Amém.',cat:'trabalho',src:'Colossenses 3:23; Efésios 5:16',dif:1,tags:['estudo','foco','mente','trabalho']},
{id:99,title:'No Trânsito',text:'Senhor, neste momento de deslocamento, que teu Espírito me acompanhe. Dá paciência quando houver demora. Dá atenção quando houver perigo. Que eu chegue em segurança ao destino. E que eu use este tempo para orar, louvar ou simplesmente descansar em tua presença.',cat:'manha',src:'Salmo 121:8; Deuteronômio 28:6',dif:1,tags:['viagem','proteção','paciência','cotidiano']},
{id:100,title:'Depois de um Pecado ou Erro',text:'Pai, caí de novo. Envergonho-me de estar aqui outra vez. Mas sei que se confessarmos os nossos pecados, ele é fiel e justo para nos perdoar e purificar de toda injustiça. Recebo esse perdão agora. Levanto-me da poeira. Tua misericórdia é nova cada manhã.',cat:'penitencia',src:'1 João 1:9; Lamentações 3:22-23',dif:1,tags:['pecado','perdão','graça','recomeço']},
{id:101,title:'Pela Memória e Entendimento',text:'Senhor, que gravaste tua lei no coração do teu povo, grava também em mim as tuas palavras. Que elas não se afastem da minha boca. Que eu medite nelas de dia e de noite para que observe tudo quanto nelas está escrito. Afia minha mente para guardar e praticar tua Palavra.',cat:'sabedoria',src:'Josué 1:8; Jeremias 31:33',dif:2,tags:['memória','palavra','meditação','entendimento']},
{id:102,title:'Por Líderes da Igreja',text:'Senhor, abençoa nosso pastor. Sustenta-o física, emocional e espiritualmente. Dá-lhe sabedoria para pregar, coragem para confrontar o pecado e amor para consolar o ferido. Protege-o das armadilhas do orgulho, da imoralidade e do esgotamento. Que ele seja um pastor segundo o teu coração.',cat:'intercecao',src:'Jeremias 3:15; 1 Pedro 5:2-3',dif:2,tags:['pastor','liderança','proteção','sabedoria']},
{id:103,title:'Pela Igreja Perseguida',text:'Senhor, estou em segurança enquanto outros irmãos pagam com a vida por confessar teu nome. Não me esqueça deles. Fortifica-os com poder pelo teu Espírito. Que eles vejam o teu rosto com clareza proporcional à sua tribulação. Que o sangue dos mártires continue sendo a semente da Igreja.',cat:'intercecao',src:'Hebreus 13:3; Tertuliano',dif:3,tags:['perseguição','mártires','fortaleza','irmãos']},
{id:104,title:'Pelos Missionários',text:'Senhor dos exércitos, abençoa aqueles que partiram para campos distantes por amor ao teu nome. Dá-lhes saúde, idioma, abertura de portas e fruto que permaneça. Protege suas famílias. Renova suas forças quando sentirem saudade e solidão. Que cada semente plantada germine e produza uma colheita abundante para tua glória.',cat:'intercecao',src:'Romanos 10:15; João 15:16',dif:2,tags:['missões','missionários','fruto','proteção']},
{id:105,title:'Pelas Crianças',text:'Senhor Jesus, que disseste "deixai as crianças virem a mim", abençoa cada criança que conheço. Protege-as das mãos do maligno. Que cresçam em sabedoria, estatura e graça diante de Deus e dos homens. Que nenhuma pedra de tropeço seja posta diante delas. Que conheçam teu amor desde a mais tenra idade.',cat:'familia',src:'Marcos 10:14; Lucas 2:52',dif:2,tags:['crianças','proteção','crescimento','amor']},
{id:106,title:'Pelos Idosos',text:'Senhor, que prometeste não abandonar os que chegam à velhice, abençoa os que chegaram a essa fase da vida. Que não se sintam esquecidos nem inúteis, pois seus dias de experiência e oração são preciosos. Dá-lhes saúde para seguir, paz para descansar e a certeza de que o melhor ainda está por vir.',cat:'familia',src:'Salmo 71:9,18; Isaías 46:4',dif:2,tags:['idosos','velhice','paz','continuidade']},
{id:107,title:'Pelos Pobres e Marginalizados',text:'Senhor, que defendes a causa do pobre e do necessitado, abre meus olhos para enxergar os invisíveis ao meu redor. Que eu não passe pelo lado do ferido como o sacerdote e o levita. Que minha fé seja demonstrada em obras. Que minha mão esteja sempre aberta. Usa-me como instrumento da tua justiça.',cat:'intercecao',src:'Provérbios 19:17; Tiago 2:14-17',dif:2,tags:['pobres','justiça','obras','compaixão']},
// ── MOMENTOS DO DIA ───────────────────────────────
{id:108,title:'Ao Acordar',text:'Bom dia, Pai. Obrigado pela noite de sono. Obrigado pelo novo dia que nenhum trabalho humano poderia me dar. Consagro cada hora de hoje ao teu serviço. Que minha primeira palavra seja de louvor. Que meu primeiro pensamento seja de ti. Começo este dia na tua presença.',cat:'manha',src:'Oração ao acordar',dif:1,tags:['manhã','início','presença','louvor']},
{id:109,title:'Antes das Refeições — Simples',text:'Senhor, obrigado por este alimento. Que nourra meu corpo para te servir. Que eu nunca esqueça os que não têm. Amém.',cat:'gratidao',src:'Oração antes das refeições',dif:1,tags:['refeição','gratidão','simplicidade']},
{id:110,title:'Antes das Refeições — Completa',text:'Pai celestial, em teu nome nos reunimos à mesa. Abençoa este alimento que provém das tuas mãos. Abençoa os que o prepararam com amor. Que este momento de refeição seja também de comunhão e de gratidão. Lembra-nos dos que hoje não têm o que comer. Que nunca tomemos por garantido o que recebemos da tua graça. Amém.',cat:'gratidao',src:'Oração à mesa cristã',dif:1,tags:['refeição','comunhão','gratidão','mesa']},
{id:111,title:'Antes de Dormir — Exame de Consciência',text:'Senhor, ao encerrar este dia, faço um exame diante de ti. Onde errei, perdoa-me. Onde acertei, toda glória é tua. Onde fui tentado e venci, obrigado. Onde fui tentado e cedi, cobre com tua misericórdia. Guarda meu sono. Que ao despertar, seja com teu louvor nos lábios.',cat:'noite',src:'Oração noturna de exame',dif:1,tags:['noite','exame','perdão','sono']},
{id:112,title:'Em Tempo de Ansiedade',text:'Senhor, minha mente não para. Os pensamentos me assombram e o futuro parece ameaçador. Mas tu me disseste para não me preocupar com o amanhã. Devo trazer tudo a ti em oração. Então aqui estou, depositando cada preocupação a teus pés. Recebo agora a tua paz que não faz sentido para minha razão.',cat:'paz',src:'Mateus 6:34; Filipenses 4:6-7',dif:2,tags:['ansiedade','paz','preocupação','confiança']},
{id:113,title:'Em Tempo de Crise Financeira',text:'Senhor, não sei como vou pagar minhas contas. Mas lembro que o mesmo Deus que alimentou cinco mil com cinco pães ainda está no trono. Que cuida dos pássaros e dos lírios. Que prometeu suprir todas as minhas necessidades segundo as riquezas da sua glória em Cristo Jesus. Confio em ti como meu provedor.',cat:'trabalho',src:'Mateus 6:26; Filipenses 4:19',dif:2,tags:['crise','finanças','confiança','provisão']},
{id:114,title:'Ao Entrar em uma Reunião',text:'Senhor, entro nesta reunião e te peço que venhas comigo. Coloca palavras sábias em minha boca. Que eu ouça mais do que fale. Que eu busque o bem comum e não apenas o meu interesse. Dá-me discernimento para perceber o que está por trás das palavras. Que tua graça seja manifesta em mim.',cat:'trabalho',src:'Provérbios 15:1; Tiago 1:19',dif:1,tags:['reunião','trabalho','sabedoria','discernimento']},
{id:115,title:'Pela Criatividade',text:'Senhor, tu que és o Criador de todas as coisas, inspira minha criatividade. Tu colocaste em Bezalel habilidade, engenho e conhecimento em todo ofício. Faz isso em mim também. Que o que eu criar reflita a beleza e a excelência do Criador. Que minha arte, meu trabalho, minha palavra seja uma oferenda a ti.',cat:'trabalho',src:'Êxodo 31:3; Gênesis 1:1',dif:2,tags:['criatividade','arte','excelência','criação']},
{id:116,title:'Por Vizinhos e Comunidade',text:'Senhor, que me mandaste amar o próximo como a mim mesmo, começo pelos vizinhos mais imediatos. Abençoa os que moram ao meu redor. Que eu seja boa notícia para minha comunidade. Que minha presença traga paz e não conflito. Que eu saiba o nome de quem mora ao meu lado e me importe com sua história.',cat:'intercecao',src:'Mateus 22:39; Lucas 10:36-37',dif:1,tags:['vizinhos','comunidade','amor','proximidade']},
// ── ORAÇÕES BÍBLICAS ESPECÍFICAS ──────────────────
{id:117,title:'Cântico de Moisés — Mar Vermelho',text:'Cantarei ao Senhor, porque triunfantemente se glorificou. O cavalo e o seu cavaleiro lançou no mar. O Senhor é a minha força e o meu cântico. Tornou-se a minha salvação. Ele é o meu Deus e eu o louvarei. O Deus de meu pai e eu o exaltarei. O Senhor é um guerreiro. O Senhor é o seu nome.',cat:'grandes_oracoes',src:'Êxodo 15:1-3',dif:3,tags:['moisés','libertação','vitória','cântico']},
{id:118,title:'Oração de Josafá — Não Sabemos o Que Fazer',text:'Senhor, Deus de nossos pais, não és tu Deus nos céus? Não governas tu sobre todos os reinos das nações? Na tua mão há poder e força, e não há quem possa resistir-te. Nossos olhos estão postos em ti. Não sabemos o que fazer, mas os nossos olhos estão postos em ti.',cat:'forca',src:'2 Crônicas 20:6,12',dif:3,tags:['josafá','fé','poder','dependência']},
{id:119,title:'Oração de Ezequias',text:'Senhor Deus de Israel, que habitas entre os querubins, tu és o único Deus de todos os reinos da terra. Tu fizeste os céus e a terra. Inclina, ó Senhor, o teu ouvido e ouve. Abre, ó Senhor, os teus olhos e vê. Agora pois, Senhor nosso Deus, salva-nos da sua mão para que todos os reinos da terra conheçam que tu somente és o Senhor.',cat:'forca',src:'2 Reis 19:15-16,19',dif:4,tags:['ezequias','clamor','fé','nações']},
{id:120,title:'Oração de Neemias',text:'Senhor, Deus do céu, o Deus grande e temível, que guarda o pacto e a misericórdia para com os que o amam e guardam os seus mandamentos. Que os teus ouvidos sejam atentos e os teus olhos abertos, para ouvires a oração do teu servo. Confesso os pecados dos filhos de Israel que praticamos contra ti.',cat:'intercecao',src:'Neemias 1:5-6',dif:4,tags:['neemias','confissão','pacto','restauração']},
{id:121,title:'Oração de Jonas',text:'Invoquei o Senhor na minha angústia e ele me respondeu. Do ventre do inferno clamei e tu ouviste a minha voz. Mas eu, com voz de ação de graças, te oferecerei sacrifício. O que votei, cumprirei. A salvação pertence ao Senhor.',cat:'forca',src:'Jonas 2:2,9',dif:3,tags:['jonas','angústia','resposta','salvação']},
{id:122,title:'Jó — Submissão ao Mistério',text:'Eu sei que podes fazer todas as coisas e que nenhum dos teus planos pode ser frustrado. Eu falava do que não entendia; coisas maravilhosas demais para mim, que eu não conhecia. Ouvi falar de ti pelo ouvir dos ouvidos, mas agora os meus olhos te veem.',cat:'consagracao',src:'Jó 42:2-3,5',dif:4,tags:['jó','submissão','sofrimento','revelação']},
{id:123,title:'Elias — Restauração no Deserto',text:'Senhor, já basta. Mas o anjo do Senhor o tocou segunda vez e disse: Levanta-te e come, porque o caminho é demasiado longo para ti. Senhor, quando me sentir esgotado e querer desistir, toca-me também. Alimenta-me para a jornada que ainda resta. Tu cuidas dos teus servos.',cat:'forca',src:'1 Reis 19:4-7',dif:3,tags:['elias','esgotamento','restauração','força']},
{id:124,title:'Abraão — Intercessão com Ousadia',text:'Longe de ti fazer tal coisa: matar o justo com o ímpio, para que o justo seja como o ímpio. Longe de ti isso! O juiz de toda a terra não fará o que é justo? Senhor, que hoje eu interceda com ousadia pelos que estão em perigo espiritual, sabendo que tu és justo e misericordioso.',cat:'intercecao',src:'Gênesis 18:25',dif:3,tags:['abraão','intercessão','justiça','misericórdia']},
{id:125,title:'Jacó — O Pacto com Deus',text:'Se Deus for comigo e me guardar nesta viagem em que vou, e me der pão para comer e roupa para vestir, e eu voltar em paz para a casa de meu pai, então o Senhor será o meu Deus. Senhor, hoje faço este pacto contigo: serei teu e tu serás meu Deus em todos os meus caminhos.',cat:'consagracao',src:'Gênesis 28:20-21',dif:3,tags:['jacó','pacto','proteção','viagem']},
{id:126,title:'Oração de Esdras',text:'Meu Deus, envergonho-me e confundo-me para levantar o meu rosto para ti, pois as nossas iniquidades se multiplicaram acima das nossas cabeças e a nossa culpa cresceu até os céus. Mas tu, Deus nosso, nos diminuíste o castigo menos do que merecem as nossas iniquidades. Dá-nos um momento de graça.',cat:'penitencia',src:'Esdras 9:6,13',dif:4,tags:['esdras','confissão','culpa','graça']},
// ── ORAÇÕES TEMÁTICAS EXTRAS ──────────────────────
{id:127,title:'Pela Saúde Mental',text:'Senhor, minha mente às vezes parece meu inimigo. Mas tu prometeste guardar em perfeita paz aquele cujo pensamento está firme em ti. Renova minha mente. Quebra os ciclos de pensamentos negativos. Que tua verdade seja mais alta do que qualquer argumento que se levante contra o teu conhecimento.',cat:'enfermos',src:'Isaías 26:3; 2 Coríntios 10:5',dif:2,tags:['saúde mental','mente','paz','pensamentos']},
{id:128,title:'Pela Libertação de Vícios',text:'Senhor Jesus, tu vieste para libertar os cativos e pregar a liberdade aos presos. Onde há escravidão em minha vida — seja ao pecado, ao vício, ao medo, ao passado — vem com tua palavra poderosa e quebra essas cadeias. Aquele a quem o Filho libertar será verdadeiramente livre.',cat:'forca',src:'Lucas 4:18; João 8:36',dif:2,tags:['liberdade','vício','correntes','libertação']},
{id:129,title:'Proteção da Família Contra o Maligno',text:'Senhor, coloco um muro de proteção espiritual ao redor da minha família. Que nenhum dardo ardente do inimigo alcance este lar. Que os anjos do Senhor acampem ao redor de nós. Que cada membro desta família seja coberto pelo sangue de Jesus. Amém.',cat:'protecao',src:'Salmo 34:7; Efésios 6:16',dif:2,tags:['proteção','família','anjos','guerra espiritual']},
{id:130,title:'Para Quem Está Solteiro',text:'Senhor, nesta fase em que estou, que eu aprenda a ser completo em ti e não na presença de outro ser humano. Usa este tempo para me moldar, me amadurecer e me preparar. Se for tua vontade que eu me case, prepara-me. Se for tua vontade que eu sirva a ti em celibato, que isso também seja suficiente.',cat:'familia',src:'1 Coríntios 7:34; Salmo 16:5',dif:2,tags:['solteiro','contentamento','missão','preparação']},
{id:131,title:'Na Espera de Uma Promessa',text:'Senhor, esperarei como Abraão esperou. Como Ana esperou. Como os apóstolos esperaram no cenáculo. Tuas promessas são sim e amém em Cristo Jesus. Não vacilei na promessa pela descrença, mas fui fortalecido na fé, dando glória a Deus. Plenamente convencido de que o que prometeste és capaz de cumprir.',cat:'forca',src:'Romanos 4:20-21; 2 Coríntios 1:20',dif:3,tags:['espera','promessa','fé','paciência']},
{id:132,title:'Unção para Orar em Público — Atos 3',text:'Senhor, quando Pedro e João encontraram aquele homem coxo, eles disseram: não tenho prata nem ouro, mas o que tenho te dou. Eu também não tenho eloquência, mas tenho o nome de Jesus. E em seu nome ordeno que este povo seja abençoado. Usa minha boca fraca como instrumento do teu poder.',cat:'orar_publico',src:'Atos 3:1-8',dif:2,tags:['unção','público','poder','nome de Jesus']},
{id:133,title:'Pelos Inimigos',text:'Senhor Jesus, tu que oraste pelo perdão daqueles que te crucificaram, ajuda-me a orar por quem me causou dano. Não consigo fazer isso na minha própria força. Mas ao orar por eles hoje, que o teu amor flua através de mim. Abençoa-os. Transforma-os. E transforma-me também neste processo.',cat:'penitencia',src:'Mateus 5:44; Lucas 23:34',dif:3,tags:['inimigos','perdão','amor','transformação']},
{id:134,title:'Oração de Contentamento',text:'Aprendi a estar contente em qualquer estado em que me encontre. Sei estar abatido e sei também ter abundância. Em toda e qualquer situação aprendi o segredo de estar satisfeito. Posso fazer todas as coisas naquele que me fortalece. Que este contentamento reine em meu coração hoje.',cat:'paz',src:'Filipenses 4:11-13',dif:2,tags:['contentamento','paz','fortaleza','gratidão']},
{id:135,title:'Por Língua Guardada',text:'Senhor, põe uma guarda à minha boca. Vigia a porta dos meus lábios. Que nenhuma palavra corrompida saia da minha boca, mas só a que for boa para edificar. A língua é um mundo de injustiça. Só tu podes domá-la. Que minhas palavras sejam como mel para o coração e medicina para os ossos.',cat:'sabedoria',src:'Salmo 141:3; Efésios 4:29; Provérbios 16:24',dif:2,tags:['língua','palavras','guarda','edificação']},
{id:136,title:'Pela Igreja Universal',text:'Senhor, a tua Igreja é composta de todas as tribos, línguas, povos e nações. Que eu nunca esqueça que faço parte de um corpo maior do que minha denominação. Une-nos no essencial. Dá-nos graça nas diferenças. Que o mundo veja nosso amor uns pelos outros e saiba que somos teus discípulos.',cat:'intercecao',src:'João 13:35; Apocalipse 7:9',dif:3,tags:['igreja','unidade','amor','tribos']},
{id:137,title:'Gratidão pela Criação',text:'Senhor Criador, que fizeste o céu e a terra, abro meus olhos para a tua obra. O sol que aquece, a chuva que faz germinar, as flores que não plantei, o ar que respiro sem esforço. Cada árvore é um sermão teu. Cada pôr do sol é tua assinatura. Que eu nunca perca o espanto diante da tua criação.',cat:'gratidao',src:'Salmo 19:1-2; Romanos 1:20',dif:2,tags:['criação','natureza','espanto','gratidão']},
{id:138,title:'Antes de Pregar ou Testemunhar',text:'Senhor, que abrires a boca, enuncia meus lábios e proclama teu louvor. Que as palavras que saírem de minha boca não sejam minhas, mas tuas. Que elas não retornem vazias, mas cumpram tua vontade. Que haja unção, clareza e amor. Que pelo menos uma vida seja transformada hoje.',cat:'orar_publico',src:'Salmo 51:15; Isaías 55:11',dif:2,tags:['pregação','testemunho','unção','palavra']},
{id:139,title:'Oração de Getsêmani — Rendição',text:'Pai, se possível, que passe de mim este cálice. Todavia, não seja feita a minha vontade, mas a tua. Senhor, quando estou diante de algo difícil que não escolheria por mim mesmo, ajuda-me a entregar como Jesus entregou. Não minha vontade, mas a tua.',cat:'consagracao',src:'Mateus 26:39',dif:2,tags:['getsêmani','rendição','vontade','sofrimento']},
{id:140,title:'Sofrimento com Propósito',text:'Senhor, como o servo sofredor de Isaías, às vezes meu sofrimento parece não ter sentido. Mas tu sabes transformar trevas em luz e morte em ressurreição. Que este sofrimento não seja desperdiçado. Que ele produza em mim uma fé mais pura, um amor mais profundo e uma compreensão mais rica do teu coração.',cat:'forca',src:'Isaías 53; Romanos 5:3-4',dif:3,tags:['sofrimento','propósito','fé','transformação']},
{id:141,title:'Pela Obediência',text:'Senhor, a obediência é melhor que o sacrifício. Quantas vezes ofereço obras religiosas enquanto desobedeço tua voz clara. Dá-me coração obediente. Que eu não apenas ouça tua palavra, mas a pratique. Que eu seja não apenas um ouvidor esquecadiço, mas um fazedor da obra.',cat:'consagracao',src:'1 Samuel 15:22; Tiago 1:22',dif:2,tags:['obediência','prática','palavra','coração']},
{id:142,title:'Oração de Quem Perdoou',text:'Senhor, perdoei. Não foi fácil. Mas solto esta pessoa e este acontecimento das mãos. Como tu perdoas setenta vezes sete, eu também escolho perdoar. Não porque o que fizeram estava certo, mas porque o rancor me aprisiona mais do que a eles. Estou livre. Eles estão entregues a ti.',cat:'penitencia',src:'Mateus 18:22; Efésios 4:32',dif:2,tags:['perdão','liberdade','rancor','libertação']},
{id:143,title:'Celebração da Ressurreição',text:'Senhor Jesus, tu ressuscitaste! A morte não teve a última palavra. O mesmo poder que te levantou do túmulo opera em mim. Toda minha esperança está neste fato histórico e eterno. Porque tu vives, eu também viverei. Porque tu venceste, eu também sou mais do que vencedor. Aleluia!',cat:'louvor',src:'João 14:19; Romanos 8:37; 1 Coríntios 15:20',dif:2,tags:['ressurreição','vitória','esperança','aleluia']},
{id:144,title:'Por Discernimento Espiritual',text:'Senhor, o mundo diz muitas coisas. Os espíritos não são todos de Deus. Dá-me o dom do discernimento. Que eu teste os espíritos para ver se são de Deus. Que eu reconheça a voz do meu Pastor e não siga estranhos. Que tua Palavra seja o critério de avaliação de tudo que ouço e vejo.',cat:'sabedoria',src:'1 João 4:1; João 10:4-5',dif:3,tags:['discernimento','espíritos','pastor','palavra']},
{id:145,title:'Gratidão pelo Dom da Vida',text:'Senhor, obrigado por cada batimento do meu coração que não precisei pedir. Por cada respiração que aconteceu automaticamente enquanto dormia. Por meus olhos que abrem e veem cor. Por meus pés que me sustentam. Por minha mente que pode pensar em ti. A vida é teu maior presente. Recebo com gratidão.',cat:'gratidao',src:'Salmo 139:14; Atos 17:25',dif:1,tags:['gratidão','vida','corpo','presente']},
{id:146,title:'No Início de uma Nova Fase',text:'Senhor, que és o mesmo ontem, hoje e para sempre, entro neste novo ciclo com expectativa e humildade. Não sei o que virá. Mas sei quem está nele comigo. Que eu não me apegue ao que ficou para trás. Que eu avance para o que está à frente, para o alvo do prêmio da soberana vocação de Deus em Cristo Jesus.',cat:'forca',src:'Hebreus 13:8; Filipenses 3:13-14',dif:2,tags:['novo início','expectativa','avanço','vocação']},
{id:147,title:'No Fim do Ano — Gratidão',text:'Senhor, ao olhar para trás vejo tua mão me sustentando. As alegrias foram tuas dádivas. As provações foram teus ensinamentos. As perdas foram redimidas pela tua graça. Obrigado por teres estado em cada capítulo deste ano. Que o próximo seja escrito com ainda mais fé, amor e ousadia.',cat:'gratidao',src:'Salmo 77:11; Filipenses 1:6',dif:2,tags:['fim de ano','gratidão','fidelidade','retrospecto']},
{id:148,title:'Pela Perseverança',text:'Senhor, às vezes quero desistir. O caminho parece longo e os resultados invisíveis. Mas tu disseste que o que perseverar até o fim será salvo. Que o que está abatido se erguerá, e o que está cansado receberá nova força. Como águias, subiremos. Correríamos e não nos cansaremos. Caminharemos e não nos fatigaremos.',cat:'forca',src:'Mateus 24:13; Isaías 40:31',dif:2,tags:['perseverança','força','renovação','caminhada']},
